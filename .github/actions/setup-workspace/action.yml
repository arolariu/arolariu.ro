#+#+#+#+############################################################
# Setup Workspace (Composite Action)
#
# Summary:
# - Installs toolchains via the internal `setup-runtime`, then bootstraps the
#   monorepo: dependency installs, Playwright browsers, code
#   generation, and the shared component build.
#
# Remarks:
# - Toolchain caching belongs to `setup-runtime` (built-in caches).
#   This action caches only what it produces itself: `node_modules`
#   and the Playwright browser bundle.
# - Neither cache key carries a workflow-name segment, but GitHub still
#   applies branch/tag scope and cache-version accessibility. The
#   Playwright key includes the requested browsers and lock-file hash;
#   the `node_modules` key includes the resolved runtime and install inputs
#   because a usable tree can skip `npm ci` and contain native addons.
# - Inputs are never interpolated directly into `run:` blocks; they
#   are passed through `env:` to avoid script injection.
#+#+#+#+############################################################

name: "Setup Workspace"
description: "Provisions toolchains and optionally installs, generates, and builds the arolariu.ro workspace."
author: "arolariu.ro"

inputs:
  # ── Toolchain (forwarded to setup-runtime) ────────────────────────
  node-install:
    description: "Whether to install Node.js."
    required: false
    default: "false"

  node-version:
    description: "Node.js version to install."
    required: false
    default: "24"

  node-registry-url:
    description: "npm registry URL to configure for publishing."
    required: false
    default: ""

  dotnet-install:
    description: "Whether to install the .NET SDK."
    required: false
    default: "false"

  dotnet-version:
    description: ".NET SDK version to install."
    required: false
    default: "10.0.x"

  python-install:
    description: "Whether to install Python."
    required: false
    default: "false"

  python-version:
    description: "Python version to install."
    required: false
    default: "3.12"

  cache:
    description: "Whether to enable toolchain download, node_modules, and Playwright caches."
    required: false
    default: "true"

  # ── Dependency installation ──────────────────────────────────────
  node-deps-install:
    description: "Whether to run `npm ci` at the repository root."
    required: false
    default: "false"

  node-scripts-install:
    description: "Whether to run `npm ci` inside `.github/scripts`."
    required: false
    default: "false"

  install-dotnet-deps:
    description: "Whether to run `dotnet restore`."
    required: false
    default: "false"

  dotnet-deps-path:
    description: "Solution or project passed to `dotnet restore`."
    required: false
    default: "arolariu.slnx"

  python-deps-install:
    description: "Whether to install Python requirements with pip."
    required: false
    default: "false"

  python-requirements-path:
    description: "Requirements file passed to `pip install -r`."
    required: false
    default: "sites/exp.arolariu.ro/requirements-dev.txt"

  playwright-install:
    description: "Whether to install Playwright browsers and OS dependencies."
    required: false
    default: "false"

  playwright-browsers:
    description: "Space-separated Playwright browsers to install."
    required: false
    default: "chromium"

  # ── Workspace tasks ──────────────────────────────────────────────
  workspace-generate:
    description: "Whether to run the monorepo generators."
    required: false
    default: "false"

  workspace-generate-args:
    description: "Generator names passed to `npm run generate` (env, artifacts, gql, i18n)."
    required: false
    default: "env artifacts gql i18n"

  components-build:
    description: "Whether to build the @arolariu/components package."
    required: false
    default: "false"

outputs:
  npm-download-cache-hit:
    description: "Whether the npm download cache was restored."
    value: ${{ steps.runtime.outputs.npm-download-cache-hit }}

  nuget-packages-cache-hit:
    description: "Whether the NuGet package cache was restored."
    value: ${{ steps.runtime.outputs.nuget-packages-cache-hit }}

  pip-download-cache-hit:
    description: "Whether the pip cache was restored."
    value: ${{ steps.runtime.outputs.pip-download-cache-hit }}

  node-modules-cache-hit:
    description: "Whether node_modules was restored from cache."
    value: ${{ steps.cache-node-modules.outputs.cache-hit }}

  playwright-browsers-cache-hit:
    description: "Whether the Playwright browser bundle was restored from cache."
    value: ${{ steps.cache-playwright.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    - name: 🚀 Initialize workspace setup
      id: init
      shell: bash
      run: echo "start_time=$(date +%s)" >> "$GITHUB_OUTPUT"

    # Runs BEFORE the toolchains are installed so a contradictory call fails
    # in seconds rather than after a full SDK provision. Without this guard a
    # disabled toolchain does not fail loudly: `npm`, `dotnet` and `python`
    # all exist on the GitHub-hosted images, so the dependent step would
    # silently run against whatever version the runner happens to ship
    # instead of the version this action pins.
    - name: 🔎 Validate input combinations
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        NODE: ${{ inputs.node-install }}
        DOTNET: ${{ inputs.dotnet-install }}
        PYTHON: ${{ inputs.python-install }}
        CACHE: ${{ inputs.cache }}
        INSTALL_NODE_DEPS: ${{ inputs.node-deps-install }}
        INSTALL_SCRIPTS_DEPS: ${{ inputs.node-scripts-install }}
        INSTALL_DOTNET_DEPS: ${{ inputs.install-dotnet-deps }}
        INSTALL_PYTHON_DEPS: ${{ inputs.python-deps-install }}
        INSTALL_PLAYWRIGHT: ${{ inputs.playwright-install }}
        RUN_GENERATE: ${{ inputs.workspace-generate }}
        RUN_BUILD_COMPONENTS: ${{ inputs.components-build }}
        DOTNET_DEPS_PATH: ${{ inputs.dotnet-deps-path }}
        PYTHON_DEPS_PATH: ${{ inputs.python-requirements-path }}
        PLAYWRIGHT_BROWSERS: ${{ inputs.playwright-browsers }}
        GENERATE_ARGS: ${{ inputs.workspace-generate-args }}
      run: |
        errors=()

        boolean() {
          case "$2" in
            true|false) ;;
            *) errors+=("  - '$1' must be 'true' or 'false'") ;;
          esac
        }

        require() {
          if [ "$3" = "true" ] && [ "$1" != "true" ]; then
            errors+=("  - '$4: true' requires '$2: true'")
          fi
        }

        require_file() {
          if [ ! -f "$2" ]; then
            errors+=("  - $1: required file does not exist")
          fi
        }

        boolean node-install "$NODE"
        boolean dotnet-install "$DOTNET"
        boolean python-install "$PYTHON"
        boolean cache "$CACHE"
        boolean node-deps-install "$INSTALL_NODE_DEPS"
        boolean node-scripts-install "$INSTALL_SCRIPTS_DEPS"
        boolean install-dotnet-deps "$INSTALL_DOTNET_DEPS"
        boolean python-deps-install "$INSTALL_PYTHON_DEPS"
        boolean playwright-install "$INSTALL_PLAYWRIGHT"
        boolean workspace-generate "$RUN_GENERATE"
        boolean components-build "$RUN_BUILD_COMPONENTS"

        # Toolchain prerequisites.
        require "$NODE" node-install "$INSTALL_NODE_DEPS" node-deps-install
        require "$NODE" node-install "$INSTALL_SCRIPTS_DEPS" node-scripts-install
        require "$DOTNET" dotnet-install "$INSTALL_DOTNET_DEPS" install-dotnet-deps
        require "$PYTHON" python-install "$INSTALL_PYTHON_DEPS" python-deps-install

        # These three consume the root `node_modules` tree. `node-deps-install`
        # gates BOTH the cache restore and `npm ci`, so with it disabled the
        # tree is absent entirely — `npm run …` would fail outright, and
        # `npx playwright` would silently fetch a floating version instead of
        # the one pinned by the lock file. `node-deps-install` in turn
        # requires `node`, so that prerequisite is covered transitively.
        require "$INSTALL_NODE_DEPS" node-deps-install "$INSTALL_PLAYWRIGHT" playwright-install
        require "$INSTALL_NODE_DEPS" node-deps-install "$RUN_GENERATE" workspace-generate
        require "$INSTALL_NODE_DEPS" node-deps-install "$RUN_BUILD_COMPONENTS" components-build

        if [ "$INSTALL_PLAYWRIGHT" = "true" ] && [[ ! "$PLAYWRIGHT_BROWSERS" =~ [^[:space:]] ]]; then
          errors+=("  - 'playwright-browsers' must not be empty when installing browsers")
        fi
        if [ "$RUN_GENERATE" = "true" ] && [[ ! "$GENERATE_ARGS" =~ [^[:space:]] ]]; then
          errors+=("  - 'workspace-generate-args' must not be empty when running generators")
        fi

        if [ "$INSTALL_NODE_DEPS" = "true" ] || { [ "$NODE" = "true" ] && [ "$CACHE" = "true" ]; }; then
          require_file package-lock.json package-lock.json
        fi
        if [ "$INSTALL_SCRIPTS_DEPS" = "true" ] || { [ "$NODE" = "true" ] && [ "$CACHE" = "true" ]; }; then
          require_file .github/scripts/package-lock.json .github/scripts/package-lock.json
        fi
        if [ "$INSTALL_DOTNET_DEPS" = "true" ]; then
          require_file dotnet-deps-path "$DOTNET_DEPS_PATH"
        fi
        if [ "$INSTALL_PYTHON_DEPS" = "true" ]; then
          require_file python-requirements-path "$PYTHON_DEPS_PATH"
        fi
        if [ "$DOTNET" = "true" ] && [ "$CACHE" = "true" ]; then
          shopt -s globstar nullglob
          locks=(**/packages.lock.json)
          if [ "${#locks[@]}" -eq 0 ]; then
            errors+=("  - NuGet caching requires at least one packages.lock.json")
          fi
        fi
        if [ "$PYTHON" = "true" ] && [ "$CACHE" = "true" ] && ! compgen -G 'sites/exp.arolariu.ro/requirements*.txt' > /dev/null; then
          errors+=("  - pip caching requires the experimental service requirements files")
        fi

        if [ ${#errors[@]} -gt 0 ]; then
          printf '%s\n' "${errors[@]}"
          echo "::error::setup-workspace received invalid inputs or missing setup files (see above)."
          exit 1
        fi

        echo "✅ Input combination is consistent"

    - name: 🧰 Provision requested runtimes
      id: runtime
      uses: ./.github/actions/setup-runtime
      with:
        node-install: ${{ inputs.node-install }}
        node-version: ${{ inputs.node-version }}
        node-registry-url: ${{ inputs.node-registry-url }}
        dotnet-install: ${{ inputs.dotnet-install }}
        dotnet-version: ${{ inputs.dotnet-version }}
        python-install: ${{ inputs.python-install }}
        python-version: ${{ inputs.python-version }}
        cache: ${{ inputs.cache }}

    - name: 🔑 Resolve workspace cache runtime
      id: cache-runtime
      if: inputs.cache == 'true' && inputs.node-deps-install == 'true'
      shell: bash
      run: |
        node_version=$(node --version)
        npm_version=$(npm --version)
        echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
        echo "npm-tree=${node_version}-npm${npm_version}" >> "$GITHUB_OUTPUT"

    - name: 💾 Restoring node_modules...
      id: cache-node-modules
      if: inputs.cache == 'true' && inputs.node-deps-install == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # `~/.npm` is intentionally absent: setup-node already owns it.
        #
        # Paths mirror the npm workspaces declared in the root package.json
        # (`packages/*`, `sites/*`), which are exactly what the root lockfile
        # governs. A blanket `**/node_modules` would also sweep in
        # `.github/scripts/node_modules` — a package with its OWN lockfile —
        # making the cache contents depend on which job happened to populate
        # it, and restoring a tree the scripts install then deletes anyway.
        path: |
          node_modules
          packages/*/node_modules
          sites/*/node_modules
        # A usable hit skips install scripts, including native-addon setup.
        key: >-
          node-modules-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-runtime.outputs.image }}-${{
          steps.cache-runtime.outputs.npm-tree }}-${{ hashFiles('package-lock.json', '.npmrc', 'package.json', 'packages/*/package.json',
          'sites/*/package.json') }}

    - name: 🔎 Verify cached npm tree
      id: verify-node-modules
      if: steps.cache-node-modules.outputs.cache-hit == 'true'
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        if node --input-type=commonjs <<'NODE_CHECK'
        const {existsSync, readFileSync} = require('node:fs');
        const {join} = require('node:path');
        try {
          // npm's hidden lock describes the installed tree, excluding optional packages absent on this platform.
          const {packages} = JSON.parse(readFileSync('node_modules/.package-lock.json', 'utf8'));
          const installed = Object.keys(packages).filter(Boolean);
          process.exitCode = installed.length && installed.every(path => existsSync(join(path, 'package.json'))) ? 0 : 1;
        } catch {
          process.exitCode = 1;
        }
        NODE_CHECK
        then
          echo "usable=true" >> "$GITHUB_OUTPUT"
        else
          echo "usable=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Cached npm tree is incomplete; reinstalling from the lockfile."
        fi

    - name: 📥 Install npm dependencies from the root lockfile
      if: inputs.node-deps-install == 'true' && steps.verify-node-modules.outputs.usable != 'true'
      shell: bash
      run: |
        echo "::group::📦 npm ci (root)"
        npm ci --prefer-offline --no-audit --no-fund
        echo "::endgroup::"

    - name: 🔗 Sync SvelteKit projects (.svelte-kit)
      if: inputs.node-deps-install == 'true'
      shell: bash
      run: |
        echo "::group::🔗 svelte-kit sync"
        # sites/{cv,status}.arolariu.ro/tsconfig.json extend
        # ./.svelte-kit/tsconfig.json, which only exists after `svelte-kit sync`.
        # That normally runs via each package's `prepare` script during `npm ci`,
        # but `npm ci` is skipped on a node_modules cache hit (see above) and
        # `.svelte-kit` is not one of the cached paths either — so it is
        # effectively never present. Without it, any repo-wide `eslint .` (which
        # the hygiene pipeline runs whenever a root shared config file changes)
        # dies with "File './.svelte-kit/tsconfig.json' not found".
        npm run prepare --workspace=sites/cv.arolariu.ro --workspace=sites/status.arolariu.ro

        # The prepare scripts end in `|| echo ''`, so a genuine sync failure would
        # otherwise pass silently and resurface as a confusing ESLint crash.
        for project in sites/cv.arolariu.ro sites/status.arolariu.ro; do
          if [ ! -f "${project}/.svelte-kit/tsconfig.json" ]; then
            echo "::error::${project}/.svelte-kit/tsconfig.json was not generated; ESLint and svelte-check will fail."
            exit 1
          fi
        done
        echo "::endgroup::"

    - name: 📥 Install .github/scripts dependencies
      if: inputs.node-scripts-install == 'true'
      shell: bash
      working-directory: .github/scripts
      run: |
        echo "::group::📦 npm ci (.github/scripts)"
        npm ci --prefer-offline --no-audit --no-fund
        echo "::endgroup::"

    - name: 📥 Restore .NET dependencies
      if: inputs.install-dotnet-deps == 'true'
      shell: bash
      env:
        DOTNET_DEPS_PATH: ${{ inputs.dotnet-deps-path }}
      run: |
        echo "::group::📦 dotnet restore"
        dotnet restore "${DOTNET_DEPS_PATH}"
        echo "::endgroup::"

    - name: 📥 Install Python dependencies
      if: inputs.python-deps-install == 'true'
      shell: bash
      env:
        PYTHON_DEPS_PATH: ${{ inputs.python-requirements-path }}
      run: |
        echo "::group::📦 pip install"
        python -m pip install --upgrade pip
        python -m pip install -r "${PYTHON_DEPS_PATH}"
        echo "::endgroup::"

    - name: 💾 Restoring Playwright browsers...
      id: cache-playwright
      if: inputs.cache == 'true' && inputs.playwright-install == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: >-
          playwright-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-runtime.outputs.image }}-${{ inputs.playwright-browsers }}-${{
          hashFiles('package-lock.json') }}

    - name: 🎭 Install Playwright browsers
      if: inputs.playwright-install == 'true'
      shell: bash
      env:
        PLAYWRIGHT_BROWSERS: ${{ inputs.playwright-browsers }}
        PLAYWRIGHT_CACHE_HIT: ${{ steps.cache-playwright.outputs.cache-hit }}
      run: |
        echo "::group::🎭 Playwright"
        # Split the space-separated browser list into an array rather than
        # relying on unquoted word-splitting, so the value cannot be glob
        # expanded against the working directory.
        read -ra browsers <<< "${PLAYWRIGHT_BROWSERS}"
        if [ "${PLAYWRIGHT_CACHE_HIT}" = "true" ]; then
          # Browsers are cached, but OS-level shared libraries are not
          # part of the cached directory and must be installed anyway.
          ./node_modules/.bin/playwright install-deps "${browsers[@]}"
        else
          ./node_modules/.bin/playwright install "${browsers[@]}" --with-deps
        fi
        echo "::endgroup::"

    - name: 🔨 Generate artifacts (env, taxonomy/licenses, GraphQL, i18n)
      if: inputs.workspace-generate == 'true'
      shell: bash
      env:
        GENERATE_ARGS: ${{ inputs.workspace-generate-args }}
      run: |
        echo "::group::🔨 npm run generate"
        # Same reasoning as the Playwright step: split deliberately into an
        # array instead of letting the shell word-split and glob the value.
        read -ra generate_args <<< "${GENERATE_ARGS}"
        npm run generate "${generate_args[@]}"
        echo "::endgroup::"

    - name: 🔨 Build the @arolariu/components package
      if: inputs.components-build == 'true'
      shell: bash
      run: |
        echo "::group::🔨 npm run build:components"
        npm run build:components
        echo "::endgroup::"

    - name: ✨ Workspace setup complete
      shell: bash
      env:
        START_TIME: ${{ steps.init.outputs.start_time }}
        NODE_CACHE_RESULT: ${{ steps.cache-node-modules.outputs.cache-hit }}
        NODE_TREE_USABLE: ${{ steps.verify-node-modules.outputs.usable }}
        PLAYWRIGHT_CACHE_RESULT: ${{ steps.cache-playwright.outputs.cache-hit }}
        CACHE: ${{ inputs.cache }}
        INSTALL_NODE_DEPS: ${{ inputs.node-deps-install }}
        INSTALL_PLAYWRIGHT: ${{ inputs.playwright-install }}
      run: |
        cache_status() {
          if [ "$1" != "true" ] || [ "$CACHE" != "true" ]; then
            echo SKIPPED
          elif [ "$2" = "true" ]; then
            echo HIT
          else
            echo MISS
          fi
        }

        NODE_MODULES_CACHE=$(cache_status "$INSTALL_NODE_DEPS" "$NODE_CACHE_RESULT")
        if [ "$NODE_TREE_USABLE" = "false" ]; then NODE_MODULES_CACHE="HIT (reinstalled)"; fi
        PLAYWRIGHT_CACHE=$(cache_status "$INSTALL_PLAYWRIGHT" "$PLAYWRIGHT_CACHE_RESULT")
        DURATION=$(( $(date +%s) - START_TIME ))
        echo "::group::✨ Workspace setup complete"
        echo "  Duration:     ${DURATION}s"
        echo "  node_modules: ${NODE_MODULES_CACHE}"
        echo "  Playwright:   ${PLAYWRIGHT_CACHE}"
        echo "::endgroup::"
