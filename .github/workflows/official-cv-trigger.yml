# Test and package the CV site. LOCAL uploads a build artifact; Azure deploys the prebuilt payload.
# Runs on main pushes touching the CV directory or on manual dispatch; serializes Azure runs by target.
# Uses the AZURE_STATIC_WEB_APPS_CV_TOKEN secret, not OIDC. SWA does not rebuild either prebuilt payload.
# Manual runs from main can pin all source checkouts to an optional full commit SHA.
# Validation: dispatch from main with infrastructure=local to build without deploying.

name: "official-cv-trigger"

concurrency:
  group: ${{ inputs.infrastructure == 'local' && format('cv-local-{0}', github.run_id) || 'deploy-cv' }}
  cancel-in-progress: false

permissions:
  contents: read # Required to checkout repository

defaults:
  run:
    working-directory: ./sites/cv.arolariu.ro

on:
  # Automatic trigger on main branch changes to CV site
  push:
    branches: ["main"]
    paths: ["sites/cv.arolariu.ro/**"]

  # Manual trigger for artifact-only builds or controlled deployments
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Optional full commit SHA from main history. Dispatch from main; blank uses the dispatch commit."
        required: false
        type: string
        default: ""
      infrastructure:
        description: "'local' uploads a site artifact without Azure; 'azure' deploys it."
        options:
          - "local"
          - "azure"
        default: "azure"
        type: choice
      environment:
        description: "Azure deployment environment; ignored for local builds."
        options:
          - "production"
        default: "production"
        type: choice

jobs:
  revision:
    name: Resolve deployment revision
    if: github.repository == 'arolariu/arolariu.ro'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      # Only read the trusted dispatch checkout; inspect the requested commit without executing it.
      - name: Checkout trusted workflow revision and main history
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and select source commit
        id: resolve
        working-directory: .
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          if [[ "$EVENT_NAME" == push ]]; then
            source_sha=$DISPATCH_SHA
          elif [[ "$DISPATCH_REF" == refs/heads/main ]]; then
            source_sha=$(bash .github/scripts/resolve-deploy-revision.sh node-install node-deps-install)
          else
            echo "::error::Manual deployments must be dispatched from main."
            exit 1
          fi
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'Source commit: `%s`\n' "$source_sha" >> "$GITHUB_STEP_SUMMARY"

  test:
    if: github.repository == 'arolariu/arolariu.ro'
    name: 🧪 Testing the CV platform...
    needs: revision
    runs-on: ubuntu-latest
    env:
      COMMIT_SHA: ${{ needs.revision.outputs.source_sha }}
      INFRASTRUCTURE: ${{ inputs.infrastructure || 'azure' }}
    steps:
      - name: 🛫 Checking out the branch inside the runner environment...
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.revision.outputs.source_sha }}

      - name: 📝 Display workflow context
        run: |
          echo "::group::🔍 Workflow Context"
          echo "┌────────────────────────────────────────────────────────────┐"
          echo "│ 📄 CV/RESUME WEBSITE PIPELINE                              │"
          echo "├────────────────────────────────────────────────────────────┤"
          echo "│ 📦 Job:           Test phase                               │"
          echo "│ 🌍 Framework:     SvelteKit                                │"
          echo "│ 🎯 Infrastructure: $INFRASTRUCTURE                    │"
          echo "│ 🏷️ Commit SHA:    $COMMIT_SHA"
          echo "│ 👤 Triggered by:  ${{ github.actor }}"
          echo "│ 📅 Timestamp:     $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "│ 🔗 Run ID:        ${{ github.run_id }}"
          echo "└────────────────────────────────────────────────────────────┘"
          echo "::endgroup::"

          # Write initial summary
          echo "## 📄 CV/Resume Website Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Framework | SvelteKit |" >> $GITHUB_STEP_SUMMARY
          echo "| Infrastructure | $INFRASTRUCTURE |" >> $GITHUB_STEP_SUMMARY

      - name: 📦 Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-install: "true"
          node-deps-install: "true"

      # The managed Function owns a separate npm lockfile, outside the root workspace.
      - name: Restore and check the managed API
        run: |
          npm ci --prefix api --workspaces=false --omit=dev --ignore-scripts
          npm run check
          npm run check:api

      - name: 🧪 Running unit tests...
        working-directory: "./sites/cv.arolariu.ro"
        run: |
          echo "::group::🧪 Running SvelteKit Tests"
          START_TIME=$(date +%s)
          npm run test:unit
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "::notice::✅ Tests completed in ${DURATION}s"
          echo "::endgroup::"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Duration | ${DURATION}s |" >> $GITHUB_STEP_SUMMARY

  build-local:
    if: github.repository == 'arolariu/arolariu.ro' && github.event_name == 'workflow_dispatch' && inputs.infrastructure == 'local'
    name: Build and export the LOCAL CV site
    needs: [revision, test]
    runs-on: ubuntu-latest
    env:
      COMMIT_SHA: ${{ needs.revision.outputs.source_sha }}
      INFRASTRUCTURE: local
    # Both modes build the same payload from the selected checkout; only Azure has a deploy job.
    steps: &build_steps
      - name: Checkout the selected source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.revision.outputs.source_sha }}
          persist-credentials: false

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-install: "true"
          node-deps-install: "true"

      - name: Build the static site
        run: |
          npm run prepare
          npm run build

      - name: Build the managed API
        run: |
          npm ci --prefix api --workspaces=false --omit=dev --ignore-scripts
          npm run build --prefix api

      - name: Package the prebuilt site and API
        id: package
        shell: bash
        run: |
          test -s build/static/index.html
          test -s build/static/staticwebapp.config.json
          test -d build/server
          entries=(static)
          has_api=false
          if [[ -d build/server ]]; then
            test -s build/server/host.json
            test -s build/server/package.json
            entries+=(server)
            has_api=true
          fi
          output="$RUNNER_TEMP/swa-package"
          mkdir -p "$output"
          tar -czf "$output/cv-site.tar.gz" -C build "${entries[@]}"
          cd "$output"
          digest=$(sha256sum "cv-site.tar.gz")
          printf '%s\n' "$digest" > "cv-site.tar.gz.sha256"
          printf 'sha256=%s\nhas_api=%s\n' "${digest%% *}" "$has_api" >> "$GITHUB_OUTPUT"
          printf 'Packaged source \x60%s\x60 for %s (managed API: %s).\n' "$COMMIT_SHA" "$INFRASTRUCTURE" "$has_api" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the prebuilt site archive and checksum
        id: upload-site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cv-${{ env.INFRASTRUCTURE }}-site-${{ needs.revision.outputs.source_sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/swa-package/cv-site.tar.gz
            ${{ runner.temp }}/swa-package/cv-site.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-azure:
    if: github.repository == 'arolariu/arolariu.ro' && (inputs.infrastructure || 'azure') == 'azure'
    name: Build the CV site for Azure
    needs: [revision, test]
    runs-on: ubuntu-latest
    env:
      COMMIT_SHA: ${{ needs.revision.outputs.source_sha }}
      INFRASTRUCTURE: azure
    outputs:
      artifact_id: ${{ steps.upload-site.outputs.artifact-id }}
      sha256: ${{ steps.package.outputs.sha256 }}
      has_api: ${{ steps.package.outputs.has_api }}
    steps: *build_steps

  deploy-azure:
    if: github.repository == 'arolariu/arolariu.ro' && (inputs.infrastructure || 'azure') == 'azure'
    name: Deploy the CV site to Azure Static Web Apps
    needs: build-azure
    runs-on: ubuntu-latest
    environment:
      name: "cv-resume"
      url: "https://cv.arolariu.ro"
    defaults:
      run:
        working-directory: .
    steps:
      - name: Confirm the build produced an artifact ID
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.build-azure.outputs.artifact_id }}
        run: |
          if [[ ! "$ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::The Azure build did not produce an artifact ID; rerun the build job."
            exit 1
          fi

      - name: Download the exact Azure build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-azure.outputs.artifact_id }}
          path: ${{ runner.temp }}/swa-package

      - name: Verify and extract the prebuilt payload
        id: payload
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.build-azure.outputs.sha256 }}
          HAS_API: ${{ needs.build-azure.outputs.has_api }}
        run: |
          cd "$RUNNER_TEMP/swa-package"
          test -s "cv-site.tar.gz"
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$EXPECTED_SHA256" "cv-site.tar.gz" | sha256sum --check
          [[ "$HAS_API" == true || "$HAS_API" == false ]]
          test "$HAS_API" = true
          tar -tzf "cv-site.tar.gz" > entries.txt
          if grep -Eq '(^|/)\.\.(/|$)|^/' entries.txt || grep -Evq '^(static|server)(/|$)' entries.txt; then
            echo "::error::Unexpected path in the site archive."
            exit 1
          fi
          mkdir "$GITHUB_WORKSPACE/swa-payload"
          tar -xzf "cv-site.tar.gz" -C "$GITHUB_WORKSPACE/swa-payload"
          cd "$GITHUB_WORKSPACE/swa-payload"
          test -s static/index.html
          test -s static/staticwebapp.config.json
          api_location=""
          if [[ "$HAS_API" == true ]]; then
            test -s server/host.json
            test -s server/package.json
            api_location=./swa-payload/server
          else
            test ! -e server
          fi
          printf 'api_location=%s\n' "$api_location" >> "$GITHUB_OUTPUT"

      # SWA uploads exactly the files built before this job entered the deployment environment.
      - name: Deploy the prebuilt CV site
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # upstream commit; supports skip_api_build (not the v1 tag)
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_CV_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./swa-payload/static"
          api_location: ${{ steps.payload.outputs.api_location }}
          output_location: ""
          skip_app_build: true
          skip_api_build: true

      - name: 📊 Deployment summary
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Live URL**: https://cv.arolariu.ro" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

          echo ""
          echo "┌────────────────────────────────────────────────────────────┐"
          echo "│ ✅ CV WEBSITE DEPLOYED SUCCESSFULLY                        │"
          echo "├────────────────────────────────────────────────────────────┤"
          echo "│ 🔗 URL: https://cv.arolariu.ro                             │"
          echo "│ 📅 Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "└────────────────────────────────────────────────────────────┘"
