# =============================================================================
# Copilot Coding Agent — Environment Setup
# =============================================================================
# Configures the development environment for GitHub's Copilot coding agent.
# This workflow runs before the agent starts working on assigned issues/PRs.
#
# Prerequisites:
#   - Node.js 24 (LTS)
#   - .NET 10.0 SDK
#   - npm dependencies installed
#   - Generated files (env, i18n, GraphQL types)
# =============================================================================

name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 🚀 Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          dotnet: "true"
