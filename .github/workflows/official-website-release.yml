# Same-run reusable release only; operators start official-website-build.
# Caller and callee must be rolled out/reverted together. No workflow_run path.
name: "official-website-release"

on:
  workflow_call:
    inputs:
      environment:
        description: "Validated website environment"
        required: true
        type: string
      source_sha:
        description: "Validated application source commit"
        required: true
        type: string
      image:
        description: "Exact published repository:tag in the existing environment registry"
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_CONTAINER_REGISTRY_ADDRESS:
        required: true

jobs:
  release:
    name: 🚀 Release
    if: github.repository == 'arolariu/arolariu.ro'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    env:
      TARGET_ENV: ${{ inputs.environment }}
      COMMIT_SHA: ${{ inputs.source_sha }}
      IMAGE: ${{ inputs.image }}
      EVENT_REF: ${{ github.ref }}
      BUILD_RUN_ID: ${{ github.run_id }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ACR_LOGIN_SERVER: ${{ secrets.AZURE_CONTAINER_REGISTRY_ADDRESS }}
    steps:
      - name: 🔎 Validate handoff and required environment bindings
        id: handoff
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          case "$TARGET_ENV" in
            development) repository=frontend/dev.arolariu; app=dev-arolariu-ro ;;
            production)
              [[ "$EVENT_REF" == "refs/heads/main" ]] || fail "Production release requires a main caller."
              repository=frontend/arolariu; app=www-arolariu-ro
              ;;
            *) fail "Unsupported website environment." ;;
          esac
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "Missing or invalid validated source SHA."
          # Check the exact passed tag, never rebuild it using this release's attempt.
          prefix="${repository}:${COMMIT_SHA}-${BUILD_RUN_ID}-"
          [[ "$IMAGE" == "$prefix"* ]] || fail "Built image does not match the validated website target/source/run."
          attempt="${IMAGE#"$prefix"}"
          [[ "$attempt" =~ ^[1-9][0-9]*$ ]] || fail "Invalid built image attempt."
          # required:true enforces a mapping, not a nonempty value. Check AFTER
          # callee environment selection, so environment secrets retain precedence.
          for binding in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ACR_LOGIN_SERVER; do
            [[ -n "${!binding}" ]] || fail "Required deployment binding $binding is empty after environment selection."
          done
          printf 'app_name=%s\n' "$app" >> "$GITHUB_OUTPUT"
      - name: 🔐 Authenticate to Azure
        uses: Azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: 🔐 Authenticate to existing registry
        shell: bash
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"
      - name: 🔎 Require the published image to exist
        shell: bash
        run: az acr repository show --name "${ACR_LOGIN_SERVER%%.*}" --image "$IMAGE" --output none
      - name: ⚓ Deploy exact passed image
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.handoff.outputs.app_name }}
          images: "${{ secrets.AZURE_CONTAINER_REGISTRY_ADDRESS }}/${{ inputs.image }}"
      - name: 📊 Release summary
        shell: bash
        env:
          APP_NAME: ${{ steps.handoff.outputs.app_name }}
        run: |
          {
            echo "## Website release"
            printf -- '- Environment: `%s`\n- App Service: `%s`\n' "$TARGET_ENV" "$APP_NAME"
            printf -- '- Source SHA: `%s`\n- Workflow-definition SHA: `%s`\n' "$COMMIT_SHA" "$WORKFLOW_SHA"
            printf -- '- Exact image (existing environment registry): `%s`\n' "$IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"
