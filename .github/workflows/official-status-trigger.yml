# =============================================================================
# Status Website Build and Deployment Workflow
# =============================================================================
# This workflow handles the CI/CD pipeline for the Status website
# (status.arolariu.ro), built with SvelteKit and deployed to Azure Static Web Apps.
#
# Architecture:
#   - Tests gate the direct build-and-deploy job
#   - Static Generation: SvelteKit builds static files for optimal performance
#   - Serverless: Deployed to Azure Static Web Apps (global CDN included)
#
# Triggers:
#   - Automatic: Push to 'main' branch with changes in sites/status.arolariu.ro/
#   - Manual: workflow_dispatch for on-demand deployments
#
# Technology Stack:
#   - SvelteKit with the official static adapter; optional direct managed APIs
#   - Node.js 24 for build environment
#   - Azure Static Web Apps for hosting
#
# Security:
#   - Deploy auth: SWA deployment token (AZURE_STATIC_WEB_APPS_STATUS_TOKEN)
#     stored in GitHub Secrets. Not OIDC.
#
# Prerequisites:
#   1. Azure Static Web Apps resource provisioned
#   2. GitHub Secrets configured:
#      - AZURE_STATIC_WEB_APPS_STATUS_TOKEN
#
# Output:
#   - URL: https://status.arolariu.ro
# =============================================================================

name: "official-status-trigger"

permissions:
  contents: read # Required to checkout repository

defaults:
  run:
    working-directory: ./sites/status.arolariu.ro

on:
  # Automatic trigger on main branch changes to Status site
  push:
    branches: ["main"]
    paths:
      - "sites/status.arolariu.ro/**"
      - "scripts/swa/**"
      - "scripts/common/**"
      - "scripts/vitest.config.ts"
      - "sites/cv.arolariu.ro/api/package.json"
      - "sites/cv.arolariu.ro/api/package-lock.json"
      - "sites/cv.arolariu.ro/api/host.json"
      - ".github/workflows/official-status-trigger.yml"
      - ".github/actions/setup-workspace/**"
      - ".github/actions/setup-tooling/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".nvmrc"
      - "nx.json"
      - "tsconfig*.json"
      - "eslint.config.ts"

  # Manual trigger for on-demand deployments
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment for deployment"
        options:
          - "production"
        default: "production"
        type: choice

env:
  COMMIT_SHA: ${{ github.sha }}

jobs:
  test:
    if: github.repository == 'arolariu/arolariu.ro'
    name: 🧪 Testing the Status platform...
    runs-on: ubuntu-latest
    steps:
      - name: 🛫 Checking out the branch inside the runner environment...
        uses: actions/checkout@v7

      - name: 📝 Display workflow context
        run: |
          echo "::group::🔍 Workflow Context"
          echo "┌────────────────────────────────────────────────────────────┐"
          echo "│ 📊 STATUS WEBSITE PIPELINE                                 │"
          echo "├────────────────────────────────────────────────────────────┤"
          echo "│ 📦 Job:           Test phase                               │"
          echo "│ 🌍 Framework:     SvelteKit                                │"
          echo "│ 🎯 Target:        Azure Static Web Apps                    │"
          echo "│ 🏷️ Commit SHA:    ${{ github.sha }}"
          echo "│ 👤 Triggered by:  ${{ github.actor }}"
          echo "│ 📅 Timestamp:     $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "│ 🔗 Run ID:        ${{ github.run_id }}"
          echo "└────────────────────────────────────────────────────────────┘"
          echo "::endgroup::"

          # Write initial summary
          echo "## 📊 Status Website Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Framework | SvelteKit |" >> $GITHUB_STEP_SUMMARY
          echo "| Target | Azure Static Web Apps |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://status.arolariu.ro |" >> $GITHUB_STEP_SUMMARY

      - name: 📦 Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Check the static site
        run: npm run check

      - name: Check deployment tooling and site lint
        working-directory: .
        run: |
          npm exec -- vitest run --config scripts/vitest.config.ts scripts/swa --coverage.enabled=false
          npm run lint:status

      - name: 🧪 Running unit tests...
        working-directory: "./sites/status.arolariu.ro"
        run: |
          echo "::group::🧪 Running SvelteKit Tests"
          START_TIME=$(date +%s)
          npm run test:unit
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "::notice::✅ Tests completed in ${DURATION}s"
          echo "::endgroup::"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Duration | ${DURATION}s |" >> $GITHUB_STEP_SUMMARY

  build-and-deploy:
    if: github.repository == 'arolariu/arolariu.ro' && needs.test.result == 'success'
    needs: test
    name: 🚀 Building and deploying the Status platform (status.arolariu.ro)...
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-status
      cancel-in-progress: false
    environment:
      name: "status"
      url: "https://status.arolariu.ro"
    steps:
      - name: 🛫 Checking out the branch inside the runner environment...
        uses: actions/checkout@v7

      - name: 📋 Display deployment context
        run: |
          echo "::group::🔍 Deployment Context"
          echo "┌────────────────────────────────────────────────────────────┐"
          echo "│ 🚀 STATUS WEBSITE DEPLOYMENT                               │"
          echo "├────────────────────────────────────────────────────────────┤"
          echo "│ 🎯 Target:        Azure Static Web Apps                    │"
          echo "│ 🔗 URL:           https://status.arolariu.ro               │"
          echo "│ 📅 Timestamp:     $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "└────────────────────────────────────────────────────────────┘"
          echo "::endgroup::"

      - name: 📦 Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: 📦 Prepare and build...
        working-directory: "./sites/status.arolariu.ro"
        run: |
          echo "::group::🏗️ Building Status Website"
          echo "📍 Framework: SvelteKit"
          echo "📍 Adapter: official static adapter"
          echo ""
          START_TIME=$(date +%s)
          npm run prepare
          npm run build
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo ""
          echo "::notice::✅ Build completed in ${DURATION}s"
          echo "::endgroup::"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🏗️ Build Results" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Duration | ${DURATION}s |" >> $GITHUB_STEP_SUMMARY
          echo "| Output | build/static |" >> $GITHUB_STEP_SUMMARY

      - name: Build an optional managed API
        id: api
        run: npm run build:api

      - name: Validate and fingerprint deployable artifacts
        run: |
          test -s build/static/index.html
          test -s build/static/404.html
          test -s build/static/staticwebapp.config.json
          test -d build/static/_app/immutable
          printf '{"commit":"%s","runId":"%s","attempt":"%s"}\n' "$COMMIT_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > build/static/deployment.json
          paths=(static)
          if [ -d build/server ]; then paths+=(server); fi
          (cd build && find "${paths[@]}" -type f -print0 | sort -z | xargs -0 sha256sum > checksums.sha256)

      - name: Retain deployable artifacts
        uses: actions/upload-artifact@v7
        with:
          name: status-swa-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
          path: |
            sites/status.arolariu.ro/build/static
            sites/status.arolariu.ro/build/server
            sites/status.arolariu.ro/build/checksums.sha256

      - name: "🚀 Deploying Status website..."
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_STATUS_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./sites/status.arolariu.ro/build/static"
          api_location: ${{ steps.api.outputs.api_location }}
          output_location: ""
          skip_app_build: true
          skip_api_build: true

      - name: Verify the deployed HTTP contract
        working-directory: .
        timeout-minutes: 5
        run: node scripts/swa/smoke.ts status https://status.arolariu.ro

      - name: 📊 Deployment summary
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Live URL**: https://status.arolariu.ro" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

          echo ""
          echo "┌────────────────────────────────────────────────────────────┐"
          echo "│ ✅ STATUS WEBSITE DEPLOYED SUCCESSFULLY                    │"
          echo "├────────────────────────────────────────────────────────────┤"
          echo "│ 🔗 URL: https://status.arolariu.ro                         │"
          echo "│ 📅 Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "└────────────────────────────────────────────────────────────┘"
