# Assemble TypeDoc, .NET, and Python reference output, build Docusaurus, then upload the docs to Azure Static Web Apps.
# Runs on main pushes (with the path ignore below) or manual dispatch. A failed extraction or build blocks upload.
# Uses AZURE_STATIC_WEB_APPS_DOCS_TOKEN; the deploy action does not use OIDC. Does not deploy the source services.
# Validation: run npm run docs:assemble and npm run build:docs locally; manual dispatch targets live documentation.

name: "official-docs-trigger"

permissions:
  id-token: write # Existing workflow grant; the token-based SWA upload below does not use OIDC.
  contents: read # Required to checkout repository

on:
  # Automatic trigger on main branch changes (except .github/)
  push:
    branches: ["main"]
    paths-ignore: [".github/*"]

  # Manual trigger for on-demand documentation regeneration
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment for deployment"
        options:
          - "production"
        default: "production"
        type: choice

env:
  COMMIT_SHA: ${{ github.sha }}

jobs:
  build-and-deploy:
    if: github.repository == 'arolariu/arolariu.ro'
    name: 🚀 Building and deploying the docs platform (docs.arolariu.ro)...
    runs-on: ubuntu-latest
    environment:
      name: "documentation"
      url: "https://docs.arolariu.ro"
    steps:
      - name: 🛫 Checking out the branch inside the runner environment...
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📝 Display workflow context
        run: |
          echo "::group::🔍 Workflow Context"
          echo "┌────────────────────────────────────────────────────────────┐"
          echo "│ 📚 DOCUMENTATION WEBSITE PIPELINE                          │"
          echo "├────────────────────────────────────────────────────────────┤"
          echo "│ 📦 Job:           Build & Deploy                           │"
          echo "│ 🌍 Framework:     Docusaurus 3.10                          │"
          echo "│ 🎯 Target:        Azure Static Web Apps                    │"
          echo "│ 🏷️ Commit SHA:    ${{ github.sha }}"
          echo "│ 👤 Triggered by:  ${{ github.actor }}"
          echo "│ 📅 Timestamp:     $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "│ 🔗 Run ID:        ${{ github.run_id }}"
          echo "└────────────────────────────────────────────────────────────┘"
          echo "::endgroup::"

          # Write initial summary
          echo "## 📚 Documentation Website Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Framework | Docusaurus 3.10 |" >> $GITHUB_STEP_SUMMARY
          echo "| Target | Azure Static Web Apps |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://docs.arolariu.ro |" >> $GITHUB_STEP_SUMMARY

      - name: 📦 Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-install: "true"
          node-deps-install: "true"
          dotnet-install: "true"
          python-install: "true"
          python-deps-install: "true"

      # The .NET extractor needs the API assembly graph and its local documentation tool.
      - name: "[DOCS::1/4] 🏗️ Installing documentation extractor dependencies..."
        run: |
          echo "::group::📦 Documentation Extractor Dependencies"
          echo "Restoring the API graph root and the DefaultDocumentation local tool..."
          START_TIME=$(date +%s)
          dotnet restore sites/api.arolariu.ro/src/Core/arolariu.Backend.Core.csproj
          dotnet tool restore
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "::notice::✅ Documentation extractor dependencies installed in ${DURATION}s"
          echo "::endgroup::"

      - name: "[DOCS::2/4] 🧾 Assembling extractor output (TypeDoc + pydoc-markdown + DefaultDocumentation)..."
        run: |
          echo "::group::📝 Docs assemble"
          echo "Running the three extractors, validation gate, and frontmatter normalizer..."
          START_TIME=$(date +%s)
          npm run docs:assemble
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "::notice::✅ Assemble completed in ${DURATION}s"
          echo "::endgroup::"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📝 Assemble Results" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Duration | ${DURATION}s |" >> $GITHUB_STEP_SUMMARY

      # This build checks generated links and prepares the static deployment layout.
      - name: "[DOCS::3/4] ⚙️ Building the Docusaurus documentation platform..."
        run: |
          echo "::group::📚 Docusaurus Build"
          echo "Building the Docusaurus static site (postbuild hook copies the SWA config and emits llms.txt)..."
          START_TIME=$(date +%s)
          npm run build:docs
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "::notice::✅ Docusaurus build completed in ${DURATION}s"
          echo "::endgroup::"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📚 Docusaurus Results" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Duration | ${DURATION}s |" >> $GITHUB_STEP_SUMMARY
          echo "| Output | sites/docs.arolariu.ro/build |" >> $GITHUB_STEP_SUMMARY

      - name: "[DOCS::4/4] 🚀 Deploying documentation..."
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_DOCS_TOKEN }}
          action: "upload"
          app_location: "./sites/docs.arolariu.ro/build" # App source code path
          output_location: "./sites/docs.arolariu.ro/build"

      - name: 📊 Deployment summary
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Live URL**: https://docs.arolariu.ro" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

          echo ""
          echo "┌────────────────────────────────────────────────────────────┐"
          echo "│ ✅ DOCUMENTATION DEPLOYED SUCCESSFULLY                     │"
          echo "├────────────────────────────────────────────────────────────┤"
          echo "│ 🔗 URL: https://docs.arolariu.ro                           │"
          echo "│ 📅 Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "└────────────────────────────────────────────────────────────┘"
