# Validate and package @arolariu/components; publish it to npm with provenance in the npm-publish environment.
# Runs on components-v* tags or manual dispatch. Publishes the exact tarball tested by the packed contract.
# Trusted Publishing uses OIDC; this does not build or deploy the website or update its package dependency.
# Validation: use manual dry-run with an unpublished version; tag pushes are real publishes.

name: "official-components-publish"

permissions:
  id-token: write # Required for OIDC authentication with npm
  contents: read # Required to checkout repository
  attestations: write # Required for provenance attestations

on:
  # Manual trigger for controlled releases
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Perform a dry run (no actual publish)"
        required: false
        default: false
        type: boolean
      tag:
        description: "NPM distribution tag (e.g., 'latest', 'beta', 'next')"
        required: false
        default: "latest"
        type: choice
        options:
          - "latest"
          - "beta"
          - "next"
          - "canary"
  # Automatic trigger on version tag pushes
  push:
    tags:
      - "components-v*" # e.g., components-v0.3.2

defaults:
  run:
    working-directory: ./packages/components

env:
  NODE_VERSION: "24"
  PACKAGE_PATH: "packages/components"

jobs:
  # ===========================================================================
  # VALIDATION JOB
  # ===========================================================================
  # Validates the package before publishing
  validate:
    name: 🔍 Validate Package
    runs-on: ubuntu-latest
    if: github.repository == 'arolariu/arolariu.ro'
    outputs:
      version: ${{ steps.package-info.outputs.version }}
      name: ${{ steps.package-info.outputs.name }}
      sha256: ${{ steps.package-digest.outputs.sha256 }}
      artifact_id: ${{ steps.upload-package.outputs.artifact-id }}
    steps:
      - name: 🛫 Checking out the branch inside the runner environment...
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📝 Display workflow context
        run: |
          echo "::group::🔍 Publish Context"
          echo "┌────────────────────────────────────────────────────────────┐"
          echo "│ 📦 NPM PACKAGE PUBLISH PIPELINE                            │"
          echo "├────────────────────────────────────────────────────────────┤"
          echo "│ 📦 Package:       @arolariu/components                     │"
          echo "│ 🏷️ Tag:          ${{ inputs.tag || 'latest' }}"
          echo "│ 🔐 Auth:          Trusted Publishing (OIDC)"
          echo "│ 🧪 Dry Run:       ${{ inputs.dry-run || 'false' }}"
          echo "│ 📅 Timestamp:     $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "│ 👤 Triggered by:  ${{ github.actor }}"
          echo "│ 🔗 Run ID:        ${{ github.run_id }}"
          echo "└────────────────────────────────────────────────────────────┘"
          echo "::endgroup::"

          # Write initial summary
          echo "## 📦 NPM Package Publish" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Package | \`@arolariu/components\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Distribution Tag | ${{ inputs.tag || 'latest' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dry Run | ${{ inputs.dry-run || 'false' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Authentication | OIDC Trusted Publishing |" >> $GITHUB_STEP_SUMMARY

      - name: 📦 Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-install: "true"
          node-deps-install: "true"
          node-version: ${{ env.NODE_VERSION }}

      - name: 📋 Extract package information
        id: package-info
        run: |
          echo "::group::📋 Package Information"
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "::notice::Package: $NAME@$VERSION"

          echo "┌────────────────────────────────────────────────────────────┐"
          echo "│ 📦 PACKAGE DETAILS                                         │"
          echo "├────────────────────────────────────────────────────────────┤"
          echo "│ Name:    $NAME"
          echo "│ Version: $VERSION"
          echo "└────────────────────────────────────────────────────────────┘"
          echo "::endgroup::"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Package Details" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Name | \`$NAME\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`$VERSION\` |" >> $GITHUB_STEP_SUMMARY

      - name: 🔍 Check if version already published
        run: |
          VERSION="${{ steps.package-info.outputs.version }}"
          NAME="${{ steps.package-info.outputs.name }}"

          echo "::group::🔍 Version Check"
          echo "Checking npm registry for $NAME@$VERSION..."

          # Check if this version already exists on npm
          if npm view "$NAME@$VERSION" version 2>/dev/null; then
            echo "::error::Version $VERSION is already published on npm!"
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ❌ Version Conflict" >> $GITHUB_STEP_SUMMARY
            echo "Version \`$VERSION\` is already published on npm." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "::notice::Version $VERSION is not yet published. Ready to proceed."
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ✅ Version Available" >> $GITHUB_STEP_SUMMARY
            echo "Version \`$VERSION\` is not yet published. Ready to proceed." >> $GITHUB_STEP_SUMMARY
          fi
          echo "::endgroup::"

      # The packed gate builds and packs once and only exports the tarball after its tests pass.
      - name: 🧪 Build, pack, and test the release tarball
        env:
          AROLARIU_COMPONENTS_PACK_OUTPUT: ${{ runner.temp }}/components-package
        run: npm run test:packed

      - name: 📦 Verify package identity and record digest
        id: package-digest
        shell: bash
        env:
          EXPECTED_NAME: ${{ steps.package-info.outputs.name }}
          EXPECTED_VERSION: ${{ steps.package-info.outputs.version }}
        run: |
          shopt -s nullglob
          archives=("$RUNNER_TEMP"/components-package/*.tgz)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one validated components tarball"
            exit 1
          fi
          tar -xOzf "${archives[0]}" package/package.json | node --input-type=commonjs -e '
            const {name, version} = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            if (name !== process.env.EXPECTED_NAME || version !== process.env.EXPECTED_VERSION) {
              throw new Error("Packed name or version does not match the validated manifest");
            }
          '
          digest=$(sha256sum "${archives[0]}")
          printf 'sha256=%s\n' "${digest%% *}" >> "$GITHUB_OUTPUT"

      - name: 📤 Upload the validated tarball
        id: upload-package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: components-package-${{ github.run_attempt }}
          path: ${{ runner.temp }}/components-package/*.tgz
          if-no-files-found: error
          retention-days: 7

  # ===========================================================================
  # PUBLISH JOB
  # ===========================================================================
  # Publishes the package to npm with trusted publishing
  publish:
    name: 🚀 Publish to npm
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/${{ needs.validate.outputs.name }}
    steps:
      - name: 🛫 Checking out the branch inside the runner environment...
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📝 Display publish context
        run: |
          echo "::group::🔍 Publish Context"
          echo "┌────────────────────────────────────────────────────────────┐"
          echo "│ 🚀 PUBLISH PHASE                                           │"
          echo "├────────────────────────────────────────────────────────────┤"
          echo "│ 📦 Package:       ${{ needs.validate.outputs.name }}@${{ needs.validate.outputs.version }}"
          echo "│ 🏷️ Tag:          ${{ inputs.tag || 'latest' }}"
          echo "│ 🔐 Auth:          Trusted Publishing (OIDC)"
          echo "│ 📅 Timestamp:     $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "└────────────────────────────────────────────────────────────┘"
          echo "::endgroup::"

      - name: 📦 Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-install: "true"
          node-version: ${{ env.NODE_VERSION }}
          node-registry-url: "https://registry.npmjs.org"
          cache: "false"

      - name: Verify the bundled npm supports Trusted Publishing
        shell: bash
        run: |
          version=$(npm --version)
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] ||
            (( BASH_REMATCH[1] < 11 || (BASH_REMATCH[1] == 11 &&
               (BASH_REMATCH[2] < 5 || (BASH_REMATCH[2] == 5 && BASH_REMATCH[3] < 1))) )); then
            echo "::error::Trusted Publishing requires npm 11.5.1 or later (found $version)"
            exit 1
          fi

      - name: 📥 Download the validated tarball by artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          path: ${{ runner.temp }}/components-publish

      - name: Verify the release tarball before publishing
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.validate.outputs.sha256 }}
        run: |
          shopt -s nullglob
          archives=("$RUNNER_TEMP"/components-publish/*.tgz)
          if [[ ${#archives[@]} -ne 1 || ! "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Expected one validated tarball and its SHA-256 digest"
            exit 1
          fi
          printf '%s  %s\n' "$EXPECTED_SHA256" "${archives[0]}" | sha256sum --check
          printf 'TARBALL=%s\n' "${archives[0]}" >> "$GITHUB_ENV"

      # The dry run still checks packaging but never creates a registry version.
      - name: 🚀 Publish to npm (Dry Run)
        if: inputs.dry-run == true
        env:
          DIST_TAG: ${{ inputs.tag || 'latest' }}
        run: npm publish "$TARBALL" --dry-run --tag "$DIST_TAG"

      - name: 🚀 Publish to npm
        if: inputs.dry-run != true
        env:
          DIST_TAG: ${{ inputs.tag || 'latest' }}
        run: npm publish "$TARBALL" --provenance --tag "$DIST_TAG" --access public
        # Note: No NODE_AUTH_TOKEN needed - using Trusted Publishing (OIDC)
        # Provenance is now explicitly generated via --provenance flag

      - name: ✅ Publish confirmation
        if: inputs.dry-run != true
        run: |
          echo "::notice::✅ Successfully published ${{ needs.validate.outputs.name }}@${{ needs.validate.outputs.version }}"
          echo ""
          echo "📦 View on npm: https://www.npmjs.com/package/${{ needs.validate.outputs.name }}"
          echo "🔐 Provenance: Automatically attached via Trusted Publishing"
          echo ""
          echo "To verify provenance, run:"
          echo "  npm audit signatures"
