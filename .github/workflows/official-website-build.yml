# Website: validate captured Git history -> mandatory tests -> build -> reusable release.
# The local workflow call uses the caller's workflow commit, even for older source.
name: "official-website-build"

permissions:
  id-token: write # Existing Azure OIDC rights, also available to reusable release
  contents: read
  issues: write # Existing test-report comments
  pull-requests: write

defaults:
  run:
    shell: bash
    working-directory: ./sites/arolariu.ro

on:
  push:
    branches: ["preview"]
    paths: ["sites/arolariu.ro/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Azure website target"
        options: ["development", "production"]
        default: "development"
        required: true
        type: choice
      commit_sha:
        description: "Optional full 40-hex commit in the selected branch's captured history (production: main)"
        default: ""
        required: false
        type: string

jobs:
  validate:
    name: 🔎 Validate source and target
    if: github.repository == 'arolariu/arolariu.ro'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      environment: ${{ steps.source.outputs.environment }}
      image_repository: ${{ steps.source.outputs.image_repository }}
      app_name: ${{ steps.source.outputs.app_name }}
    steps:
      - name: 📥 Read captured history (no credentials persisted)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 🔎 Resolve Git source and known Azure target
        id: source
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          CAPTURED_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          COMMIT_INPUT: ${{ inputs.commit_sha }}
          TARGET_INPUT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          case "$EVENT_NAME" in
            push)
              [[ "$EVENT_REF" == "refs/heads/preview" ]] || fail "Automatic website builds require preview."
              target=development
              ;;
            workflow_dispatch) target="$TARGET_INPUT" ;;
            *) fail "Unsupported deployment event." ;;
          esac
          case "$target" in
            development) repository=frontend/dev.arolariu; app=dev-arolariu-ro ;;
            production)
              [[ "$EVENT_REF" == "refs/heads/main" ]] || fail "Production dispatch must select main."
              repository=frontend/arolariu; app=www-arolariu-ro
              ;;
            *) fail "Unsupported website environment; select development or production." ;;
          esac
          [[ "$EVENT_REF" == refs/heads/* ]] || fail "Select a repository branch, not a tag."
          git check-ref-format "$EVENT_REF" || fail "Invalid branch ref."
          [[ "$CAPTURED_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "Invalid captured event SHA."
          [[ "$(git rev-parse --is-shallow-repository)" == false ]] || fail "Full captured history is required."
          [[ "$(git cat-file -t "$CAPTURED_SHA")" == commit ]] || fail "Captured event commit is unavailable."
          source_sha="$CAPTURED_SHA"
          if [[ -n "$COMMIT_INPUT" ]]; then
            [[ "$COMMIT_INPUT" =~ ^[0-9a-fA-F]{40}$ ]] || fail "commit_sha must be a full 40-hex commit ID."
            source_sha="${COMMIT_INPUT,,}"
          fi
          [[ "$(git cat-file -t "$source_sha")" == commit ]] || fail "Selected SHA is not an available commit."
          git merge-base --is-ancestor "$source_sha" "$CAPTURED_SHA" ||
            fail "Selected commit is outside the selected branch's captured history."
          printf 'source_sha=%s\nenvironment=%s\nimage_repository=%s\napp_name=%s\n' \
            "$source_sha" "$target" "$repository" "$app" >> "$GITHUB_OUTPUT"
          {
            echo "## Validated website source"
            printf -- '- Source SHA: `%s`\n- Workflow-definition SHA: `%s`\n' "$source_sha" "$WORKFLOW_SHA"
            printf -- '- Captured branch: `%s`\n- Azure target: `%s` / `%s` / `%s`\n' "$EVENT_REF" "$target" "$app" "$repository"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: 🧪 Test phase
    needs: [validate]
    if: github.repository == 'arolariu/arolariu.ro' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ needs.validate.outputs.environment }}
    timeout-minutes: 60
    env:
      COMMIT_SHA: ${{ needs.validate.outputs.source_sha }}
      INFRA: azure
      PRODUCTION: ${{ needs.validate.outputs.environment == 'production' && 'true' || 'false' }}
      SITE_ENV: ${{ needs.validate.outputs.environment == 'production' && 'PRODUCTION' || 'DEVELOPMENT' }}
      SITE_NAME: ${{ needs.validate.outputs.environment == 'production' && 'arolariu.ro' || 'dev.arolariu.ro' }}
      SITE_URL: ${{ needs.validate.outputs.environment == 'production' && 'https://arolariu.ro' || 'https://dev.arolariu.ro' }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_FRONTEND_MANAGED_IDENTITY_CLIENT_ID }}
    steps:
      - name: 📥 Checkout validated source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - name: 🔒 Authenticate to Azure
        uses: Azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: 📦 Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          install-playwright: "true"
          run-generate: "true"
          generate-args: "artifacts gql i18n"
      - name: 📝 Set public build timestamp
        run: echo "TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: 🧬 TypeScript type-check (tsgo)
        run: |
          npx next typegen
          npx -y -p @typescript/native-preview tsgo --noEmit -p tsconfig.json
      - name: 🧪 Run unit tests
        run: npm run test:unit
      - name: 🎭 Run E2E tests
        run: npm run test:e2e
        env:
          E2E_USE_PROD: "true"
      - name: 📤 Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ needs.validate.outputs.environment }}-${{ github.run_id }}
          path: sites/arolariu.ro/code-cov/
          if-no-files-found: error
          retention-days: 7
      - name: 💬 Create PR comment
        uses: actions/github-script@v8
        if: github.event_name == 'push' && github.ref == 'refs/heads/preview'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          BRANCH_NAME: ${{ github.ref_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { execSync } = require('child_process');
            execSync('cd .github/scripts && npm ci', { stdio: 'inherit' });
            const { pathToFileURL } = require('url');
            const scriptUrl = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/src/runUnitTestAction.ts`);
            const { default: runUnitTestAction } = await import(scriptUrl.href);
            await runUnitTestAction();
      - name: ☂️ Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: "sites/arolariu.ro/code-cov"

  build:
    name: ⚒️ Build and smoke-test image
    needs: [validate, test]
    if: github.repository == 'arolariu/arolariu.ro' && needs.validate.result == 'success' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ needs.validate.outputs.environment }}
    outputs:
      image: ${{ steps.publish.outputs.image }}
    env:
      COMMIT_SHA: ${{ needs.validate.outputs.source_sha }}
      IMAGE_REPOSITORY: ${{ needs.validate.outputs.image_repository }}
      INFRA: azure
      PRODUCTION: ${{ needs.validate.outputs.environment == 'production' && 'true' || 'false' }}
      SITE_ENV: ${{ needs.validate.outputs.environment == 'production' && 'PRODUCTION' || 'DEVELOPMENT' }}
      SITE_NAME: ${{ needs.validate.outputs.environment == 'production' && 'arolariu.ro' || 'dev.arolariu.ro' }}
      SITE_URL: ${{ needs.validate.outputs.environment == 'production' && 'https://arolariu.ro' || 'https://dev.arolariu.ro' }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_FRONTEND_MANAGED_IDENTITY_CLIENT_ID }}
      ACR_LOGIN_SERVER: ${{ secrets.AZURE_CONTAINER_REGISTRY_ADDRESS }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
    steps:
      - name: 📥 Checkout validated source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - name: 🏷️ Select run-specific image
        id: image
        env:
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          printf 'image=%s:%s-%s-%s\n' "$IMAGE_REPOSITORY" "$COMMIT_SHA" "$BUILD_RUN_ID" "$BUILD_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: 🔒 Authenticate to Azure
        uses: Azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: 📦 Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          run-generate: "true"
          generate-args: "artifacts gql i18n"
      - name: 📝 Set public build timestamp
        run: echo "TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: 🔒 Authenticate to existing registry
        working-directory: .
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"
      - name: 🏗️ Build Docker image
        working-directory: .
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          docker build -f infra/containers/Dockerfile.frontend \
            --build-arg "AZURE_TENANT_ID=$AZURE_TENANT_ID" \
            --build-arg "AZURE_SUBSCRIPTION_ID=$AZURE_SUBSCRIPTION_ID" \
            --build-arg "AZURE_CLIENT_ID=$AZURE_CLIENT_ID" \
            --build-arg "COMMIT_SHA=$COMMIT_SHA" \
            --build-arg "INFRA=$INFRA" \
            --build-arg "SITE_ENV=$SITE_ENV" \
            --build-arg "SITE_URL=$SITE_URL" \
            --build-arg "SITE_NAME=$SITE_NAME" \
            --build-arg "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" \
            --build-arg "TIMESTAMP=$TIMESTAMP" \
            -t "${ACR_LOGIN_SERVER}/${IMAGE}" .
      - name: 🧪 Smoke test final image runtime configuration
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: node tests/container/runtime-configuration.smoke.mjs "${ACR_LOGIN_SERVER}/${IMAGE}" "$SITE_ENV"
      - name: ⏫ Publish exact tested image
        id: publish
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          BUILT_IMAGE="${ACR_LOGIN_SERVER}/${IMAGE}"
          docker push "$BUILT_IMAGE"
          # Registry-relative identity avoids secret-masking of cross-job outputs.
          printf 'image=%s\n' "$IMAGE" >> "$GITHUB_OUTPUT"
          printf '\n## Published website image\n- Image (existing environment registry): `%s`\n- Source SHA: `%s`\n' \
            "$IMAGE" "$COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: 🚀 Release exact built image
    needs: [validate, test, build]
    if:
      github.repository == 'arolariu/arolariu.ro' && needs.validate.result == 'success' && needs.test.result == 'success' &&
      needs.build.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/official-website-release.yml
    with:
      environment: ${{ needs.validate.outputs.environment }}
      source_sha: ${{ needs.validate.outputs.source_sha }}
      image: ${{ needs.build.outputs.image }}
    # Named mappings are required even when the value exists only on the callee's
    # environment. Environment values take precedence; the callee checks empties.
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CONTAINER_REGISTRY_ADDRESS: ${{ secrets.AZURE_CONTAINER_REGISTRY_ADDRESS }}
