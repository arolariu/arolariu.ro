---
# =============================================================================
# Code Hygiene Check Workflow (v3)
# =============================================================================
# Architecture:
#   Job 1 (detect): checkout + git diff to decide whether hygiene needs to run.
#   Job 2 (hygiene): checkout + setup workspace + single 'npm ci' for scripts,
#                    then one step per provider (continue-on-error true on each),
#                    then a final 'gate' step (no continue-on-error) that loads
#                    all outcome-*.json artifacts and runs projections.
#
# Honest pass/fail:
#   - Each provider step uses step-level continue-on-error: true. runProvider.ts
#     exits non-zero (1) when its gateResult is 'failed' or 'errored', so the
#     step UI renders a warning marker (yellow triangle) on the failing step
#     while subsequent steps still run.
#   - The final gate step (runProjections.ts) is the SINGLE source of truth for
#     workflow pass/fail: it calls core.setFailed() when the aggregated
#     HygieneReport.overallResult is 'failed' or 'errored'.
#
# Migration note: keeping the file name 'official-hygiene-check-v2.yml' so
# existing branch protection rules continue to match. The workflow's display
# name updates to '(v3)'.
# =============================================================================

name: "Code Hygiene Check (v3)"

permissions:
  contents: read
  pull-requests: write
  checks: write

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
  BASE_BRANCH: ${{ github.event.pull_request.base.ref || 'main' }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  detect:
    name: 🧩 Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has-changes: ${{ steps.detect.outputs.has-changes }}
      changed-files-count: ${{ steps.detect.outputs.changed-files-count }}
    steps:
      - name: 🛫 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.HEAD_REF }}

      - name: 🔎 Detect changed files
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          # Fetch the PR base branch (may differ from main when targeting preview etc.)
          git fetch origin "$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH" --depth=1 --no-tags --quiet || true
          # Also fetch the exact base SHA in case the branch has moved since PR creation.
          git fetch origin "${{ env.BASE_REF }}" --depth=1 --no-tags --quiet || true
          if ! CHANGED=$(git diff --name-only "${{ env.BASE_REF }}...${{ env.HEAD_REF }}" 2>/dev/null | wc -l | tr -d ' '); then
            echo "::warning::Could not compute diff against base $BASE_REF; defaulting to has-changes=true so hygiene still runs."
            CHANGED=1
          fi
          echo "Detected $CHANGED changed file(s)."
          if [ "$CHANGED" -gt 0 ]; then
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          fi
          echo "changed-files-count=$CHANGED" >> "$GITHUB_OUTPUT"

  hygiene:
    name: 🧹 Run hygiene checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: detect
    if: needs.detect.outputs.has-changes == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: 🛫 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.HEAD_REF }}

      - name: 📦 Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-key-prefix: 'hygiene-${{ github.event.pull_request.number || github.run_id }}'
          install-node-dependencies: 'true'

      - name: 📦 Install scripts deps (single npm ci)
        working-directory: .github/scripts
        run: npm ci

      - name: 🔨 Build components package
        run: npm run build:components

      # ----- Provider steps (step-level continue-on-error) -----
      - name: 🎨 Provider · Prettier (format)
        id: provider-format
        continue-on-error: true
        working-directory: .github/scripts
        run: node --experimental-strip-types src/hygiene/pipeline/runProvider.ts format

      - name: 🔍 Provider · ESLint (lint)
        id: provider-lint
        continue-on-error: true
        working-directory: .github/scripts
        run: node --experimental-strip-types src/hygiene/pipeline/runProvider.ts lint

      - name: 🧪 Provider · Vitest (test)
        id: provider-test
        continue-on-error: true
        working-directory: .github/scripts
        run: node --experimental-strip-types src/hygiene/pipeline/runProvider.ts test

      - name: 📊 Provider · Statistics (stats)
        id: provider-stats
        continue-on-error: true
        working-directory: .github/scripts
        run: node --experimental-strip-types src/hygiene/pipeline/runProvider.ts stats

      # ----- Final gate (NO continue-on-error) -----
      - name: 🎯 Run projections & gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: .github/scripts
        run: node --experimental-strip-types src/hygiene/pipeline/runProjections.ts

      # ----- Artifact upload (always, even on failure) -----
      - name: 📤 Upload hygiene artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hygiene-report
          path: |
            artifacts/hygiene/hygiene-report.json
            artifacts/hygiene/outcome-*.json
          retention-days: 7
