---
# One validated plan selects work and setup for the six existing named jobs.
# Every job emits executed or explicitly skipped versioned evidence. The gate
# retains artifact directories so rerun provenance/conflicts survive collection.
name: "Code Hygiene Check (v3)"

permissions:
  contents: read
  pull-requests: write
  checks: write

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      scope:
        description: "Use dependency-aware affected checks or explicitly run full scope."
        default: affected
        required: false
        type: choice
        options:
          - affected
          - full

concurrency:
  group: hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
  BASE_BRANCH: ${{ github.event.pull_request.base.ref || 'main' }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  detect:
    name: 🧩 Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      provider-matrix: ${{ steps.plan.outputs.provider-matrix }}
      plan-id: ${{ steps.plan.outputs.plan-id }}
    steps:
      - name: 🛫 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.HEAD_REF }}

      - name: 📦 Setup planning dependencies
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-node-deps: "true"
          install-scripts-deps: "true"

      - name: 🔎 Prepare validated hygiene plan
        id: plan
        working-directory: .github/scripts
        env:
          HYGIENE_SCOPE: ${{ inputs.scope || 'affected' }}
        run: node --experimental-strip-types src/hygiene/pipeline/preparePlan.ts --scope "$HYGIENE_SCOPE"

      - name: 📤 Upload shared hygiene plan
        uses: actions/upload-artifact@v7
        with:
          name: hygiene-plan
          path: artifacts/hygiene/plan.json
          if-no-files-found: error
          retention-days: 7

  providers:
    name: "🔧 ${{ matrix.provider.label }}"
    needs: detect
    if: needs.detect.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.provider-matrix) }}
    steps:
      - name: 🛫 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.HEAD_REF }}

      - name: 📥 Download shared hygiene plan
        uses: actions/download-artifact@v8
        with:
          name: hygiene-plan
          path: artifacts/hygiene

      # Scripts/Node bootstrap is mandatory even for skipped evidence. All
      # expensive root/toolchain/build/generation work follows plan booleans.
      - name: 📦 Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-node-deps: ${{ matrix.provider.root-node-deps }}
          install-scripts-deps: "true"
          run-build-components: ${{ matrix.provider.build-components }}
          run-generate: ${{ matrix.provider.generate-artifacts }}
          generate-args: "artifacts"
          dotnet: ${{ matrix.provider.needs-dotnet }}
          python: ${{ matrix.provider.needs-python }}

      # Preserve best-effort dependency restoration; the actual provider
      # process/evidence remains authoritative and cannot turn failure to pass.
      - name: 📦 Restore .NET projects (best-effort)
        if: matrix.provider.needs-dotnet
        run: dotnet restore arolariu.slnx
        continue-on-error: true

      - name: 📦 Install Python dev deps (best-effort)
        if: matrix.provider.needs-python
        run: python -m pip install -q -r sites/exp.arolariu.ro/requirements-dev.txt
        continue-on-error: true

      - name: 🚀 Run provider (${{ matrix.provider.id }})
        id: run-provider
        working-directory: .github/scripts
        run:
          node --experimental-strip-types src/hygiene/pipeline/runProvider.ts ${{ matrix.provider.id }} --plan
          "$GITHUB_WORKSPACE/artifacts/hygiene/plan.json"

      - name: 📤 Upload outcome artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: outcome-${{ matrix.provider.id }}
          path: artifacts/hygiene/outcome-${{ matrix.provider.id }}.json
          if-no-files-found: warn
          retention-days: 7

  gate:
    name: 🎯 Aggregate & gate
    needs: [detect, providers]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 🛫 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ env.HEAD_REF }}

      - name: 📦 Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-node-deps: "false"
          install-scripts-deps: "true"

      - name: 📥 Download shared hygiene plan
        uses: actions/download-artifact@v8
        with:
          name: hygiene-plan
          path: artifacts/hygiene

      - name: 📥 Download outcome evidence with provenance
        uses: actions/download-artifact@v8
        # The verifier still runs on download failure so it can publish a
        # required errored report for missing evidence, never a false pass.
        continue-on-error: true
        with:
          pattern: outcome-*
          path: artifacts/hygiene/outcomes
          merge-multiple: false

      - name: 🎯 Run projections & gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: .github/scripts
        run: node --experimental-strip-types src/hygiene/pipeline/runProjections.ts --plan "$GITHUB_WORKSPACE/artifacts/hygiene/plan.json"

      - name: 📤 Upload aggregated hygiene report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hygiene-report
          path: |
            artifacts/hygiene/hygiene-report.json
            artifacts/hygiene/plan.json
            artifacts/hygiene/outcomes/**/outcome-*.json
          retention-days: 7
