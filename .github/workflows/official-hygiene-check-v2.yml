---
# =============================================================================
# Code Hygiene Check Workflow (v3)
# =============================================================================
# Architecture (parallel):
#   Job 1 (detect): checkout + git diff. Decides whether hygiene runs at all.
#   Job 2 (providers, matrix): one parallel job per check provider. Each
#     provisions only the toolchain it needs (Node always; .NET only for
#     test-dotnet; Python only for test-python). Each writes its outcome JSON
#     and uploads it as an artifact named outcome-<provider>.
#   Job 3 (gate): downloads every outcome-* artifact, runs runProjections.ts
#     to build the aggregate HygieneReport, post the PR comment, write step
#     summary, create per-provider check-runs. The gate step (no
#     continue-on-error) is the SINGLE source of truth for workflow pass/fail.
#
# Honest pass/fail:
#   - runProvider.ts exits 1 on failed/errored gateResult, 0 otherwise. With
#     step-level continue-on-error: true, the failing matrix job is marked
#     failed but other provider jobs (and the gate job) still run.
#   - Final gate calls core.setFailed() when aggregated overallResult is
#     'failed' or 'errored'.
#
# Migration note: keeping the file name 'official-hygiene-check-v2.yml' so
# existing branch protection rules continue to match.
# =============================================================================

name: "Code Hygiene Check (v3)"

permissions:
  contents: read
  pull-requests: write
  checks: write

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
  BASE_BRANCH: ${{ github.event.pull_request.base.ref || 'main' }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  detect:
    name: 🧩 Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has-changes: ${{ steps.detect.outputs.has-changes }}
      changed-files-count: ${{ steps.detect.outputs.changed-files-count }}
    steps:
      - name: 🛫 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.HEAD_REF }}

      - name: 🔎 Detect changed files
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH" --depth=1 --no-tags --quiet || true
          git fetch origin "${{ env.BASE_REF }}" --depth=1 --no-tags --quiet || true
          if ! CHANGED=$(git diff --name-only "${{ env.BASE_REF }}...${{ env.HEAD_REF }}" 2>/dev/null | wc -l | tr -d ' '); then
            echo "::warning::Could not compute diff against base $BASE_REF; defaulting to has-changes=true so hygiene still runs."
            CHANGED=1
          fi
          echo "Detected $CHANGED changed file(s)."
          if [ "$CHANGED" -gt 0 ]; then
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          fi
          echo "changed-files-count=$CHANGED" >> "$GITHUB_OUTPUT"

  # =============================================================================
  # Provider matrix: one parallel job per provider. Each provisions only the
  # toolchain it needs and uploads its outcome JSON as an artifact.
  # =============================================================================
  providers:
    name: "🔧 ${{ matrix.provider.label }}"
    needs: detect
    if: needs.detect.outputs.has-changes == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        provider:
          - {id: format,          label: "Prettier",                needs-dotnet: false, needs-python: false}
          - {id: lint,            label: "ESLint",                  needs-dotnet: false, needs-python: false}
          - {id: test-typescript, label: "TypeScript Unit Tests",   needs-dotnet: false, needs-python: false}
          - {id: test-dotnet,     label: "DotNet Unit Tests",       needs-dotnet: true,  needs-python: false}
          - {id: test-python,     label: "Python Unit Tests",       needs-dotnet: false, needs-python: true}
          - {id: stats,           label: "Statistics",              needs-dotnet: false, needs-python: false}
    steps:
      - name: 🛫 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.HEAD_REF }}

      - name: 📦 Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-key-prefix: 'hygiene-${{ matrix.provider.id }}-${{ github.event.pull_request.number || github.run_id }}'
          install-node-dependencies: 'true'

      - name: 📦 Install scripts deps
        working-directory: .github/scripts
        run: npm ci

      - name: 🔨 Build components package
        if: matrix.provider.id == 'lint' || matrix.provider.id == 'test-typescript'
        run: npm run build:components

      - name: 🔧 SvelteKit sync (generates .svelte-kit/tsconfig.json required by eslint-plugin-n)
        if: matrix.provider.id == 'lint'
        working-directory: sites/cv.arolariu.ro
        run: npx svelte-kit sync
        continue-on-error: true

      - name: 📦 Setup .NET
        if: matrix.provider.needs-dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: 📦 Restore .NET projects
        if: matrix.provider.needs-dotnet
        run: dotnet restore arolariu.slnx
        continue-on-error: true

      - name: 📦 Setup Python
        if: matrix.provider.needs-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: sites/exp.arolariu.ro/requirements-dev.txt

      - name: 📦 Install Python dev deps
        if: matrix.provider.needs-python
        working-directory: sites/exp.arolariu.ro
        run: python -m pip install -q -r requirements-dev.txt
        continue-on-error: true

      - name: 🚀 Run provider (${{ matrix.provider.id }})
        id: run-provider
        working-directory: .github/scripts
        run: node --experimental-strip-types src/hygiene/pipeline/runProvider.ts ${{ matrix.provider.id }}

      - name: 📤 Upload outcome artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: outcome-${{ matrix.provider.id }}
          path: artifacts/hygiene/outcome-${{ matrix.provider.id }}.json
          if-no-files-found: warn
          retention-days: 7

  # =============================================================================
  # Final gate: download every outcome artifact, aggregate, post comment / step
  # summary / status checks, decide overall workflow pass/fail.
  # =============================================================================
  gate:
    name: 🎯 Aggregate & gate
    needs: providers
    if: always() && (needs.detect.outputs.has-changes == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 🛫 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ env.HEAD_REF }}

      - name: 📦 Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-key-prefix: 'hygiene-gate-${{ github.event.pull_request.number || github.run_id }}'
          install-node-dependencies: 'false'

      - name: 📦 Install scripts deps
        working-directory: .github/scripts
        run: npm ci

      - name: 📥 Download all outcome artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: outcome-*
          path: artifacts/hygiene
          merge-multiple: true

      - name: 📋 List downloaded outcomes
        run: ls -la artifacts/hygiene/ || echo "(empty)"

      - name: 🎯 Run projections & gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: .github/scripts
        run: node --experimental-strip-types src/hygiene/pipeline/runProjections.ts

      - name: 📤 Upload aggregated hygiene report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hygiene-report
          path: |
            artifacts/hygiene/hygiene-report.json
            artifacts/hygiene/outcome-*.json
          retention-days: 7
