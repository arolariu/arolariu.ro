# Experimental service: captured main history -> mandatory Python checks -> Azure.
name: "official-exp-trigger"

permissions:
  id-token: write
  contents: read

defaults:
  run:
    shell: bash
    working-directory: ./sites/exp.arolariu.ro

on:
  push:
    branches: ["main"]
    paths: ["sites/exp.arolariu.ro/**"]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Optional full 40-hex commit in main's captured history; select main"
        default: ""
        required: false
        type: string

jobs:
  validate:
    name: 🔎 Validate production source
    if: github.repository == 'arolariu/arolariu.ro'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      environment: ${{ steps.source.outputs.environment }}
      image_repository: ${{ steps.source.outputs.image_repository }}
      app_name: ${{ steps.source.outputs.app_name }}
    steps:
      - name: 📥 Read captured history (no credentials persisted)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 🔎 Resolve Git source and fixed Azure target
        id: source
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          CAPTURED_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          COMMIT_INPUT: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          case "$EVENT_NAME" in
            push|workflow_dispatch) ;;
            *) fail "Unsupported deployment event." ;;
          esac
          [[ "$EVENT_REF" == "refs/heads/main" ]] || fail "Production deployment must select main."
          [[ "$CAPTURED_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "Invalid captured event SHA."
          [[ "$(git rev-parse --is-shallow-repository)" == false ]] || fail "Full captured history is required."
          [[ "$(git cat-file -t "$CAPTURED_SHA")" == commit ]] || fail "Captured event commit is unavailable."
          source_sha="$CAPTURED_SHA"
          if [[ -n "$COMMIT_INPUT" ]]; then
            [[ "$COMMIT_INPUT" =~ ^[0-9a-fA-F]{40}$ ]] || fail "commit_sha must be a full 40-hex commit ID."
            source_sha="${COMMIT_INPUT,,}"
          fi
          [[ "$(git cat-file -t "$source_sha")" == commit ]] || fail "Selected SHA is not an available commit."
          git merge-base --is-ancestor "$source_sha" "$CAPTURED_SHA" ||
            fail "Selected commit is outside main's captured history."
          printf 'source_sha=%s\nenvironment=production\nimage_repository=exp/exp.arolariu\napp_name=exp-arolariu-ro\n' \
            "$source_sha" >> "$GITHUB_OUTPUT"
          {
            echo "## Validated experimental source"
            printf -- '- Source SHA: `%s`\n- Workflow-definition SHA: `%s`\n' "$source_sha" "$WORKFLOW_SHA"
            echo '- Azure target: production / exp-arolariu-ro / exp/exp.arolariu'
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: 🧪 Test phase (1/3)
    needs: [validate]
    if: github.repository == 'arolariu/arolariu.ro' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ needs.validate.outputs.environment }}
    timeout-minutes: 10
    env:
      COMMIT_SHA: ${{ needs.validate.outputs.source_sha }}
      INFRA: azure
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_BACKEND_MANAGED_IDENTITY_CLIENT_ID }}
    steps:
      - name: 📥 Checkout validated source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - name: 📦 Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node: "false"
          install-node-deps: "false"
          python: "true"
          install-python-deps: "true"
      - name: 🔍 Run lint checks
        run: python -m ruff check .
      - name: 🔐 Run security checks
        run: python -m bandit -q -r . --exclude "./*test*"
      - name: 🧪 Run unit tests
        env:
          # Unit-test isolation only; this is not a deployment target choice.
          INFRA: local
        run: python -m pytest -v --tb=short --cov=. --cov-report=term-missing --cov-fail-under=85

  build:
    name: 🛠️ Build phase (2/3)
    needs: [validate, test]
    if: github.repository == 'arolariu/arolariu.ro' && needs.validate.result == 'success' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ needs.validate.outputs.environment }}
    outputs:
      image: ${{ steps.publish.outputs.image }}
    env:
      COMMIT_SHA: ${{ needs.validate.outputs.source_sha }}
      IMAGE_REPOSITORY: ${{ needs.validate.outputs.image_repository }}
      INFRA: azure
      ACR_LOGIN_SERVER: ${{ secrets.AZURE_CONTAINER_REGISTRY_ADDRESS }}
    steps:
      - name: 📥 Checkout validated source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - name: 🏷️ Select run-specific image
        id: image
        env:
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          printf 'image=%s:%s-%s-%s\n' "$IMAGE_REPOSITORY" "$COMMIT_SHA" "$BUILD_RUN_ID" "$BUILD_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: 🔒 Authenticate to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: 🔒 Authenticate to existing registry
        working-directory: .
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"
      - name: 🏗️ Build Docker image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          docker build --label "org.opencontainers.image.revision=$COMMIT_SHA" \
            -t "${ACR_LOGIN_SERVER}/${IMAGE}" .
      - name: ⏫ Publish exact built image
        id: publish
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          BUILT_IMAGE="${ACR_LOGIN_SERVER}/${IMAGE}"
          docker push "$BUILT_IMAGE"
          printf 'image=%s\n' "$IMAGE" >> "$GITHUB_OUTPUT"
          printf '\n## Published experimental image\n- Image (existing environment registry): `%s`\n- Source SHA: `%s`\n' \
            "$IMAGE" "$COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: 🚀 Deploy phase (3/3)
    needs: [validate, test, build]
    if:
      github.repository == 'arolariu/arolariu.ro' && needs.validate.result == 'success' && needs.test.result == 'success' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: .
    environment:
      name: ${{ needs.validate.outputs.environment }}
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    env:
      COMMIT_SHA: ${{ needs.validate.outputs.source_sha }}
      IMAGE: ${{ needs.build.outputs.image }}
      BUILD_RUN_ID: ${{ github.run_id }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      ACR_LOGIN_SERVER: ${{ secrets.AZURE_CONTAINER_REGISTRY_ADDRESS }}
    steps:
      - name: 🔎 Validate exact build output
        id: handoff
        run: |
          set -euo pipefail
          prefix="exp/exp.arolariu:${COMMIT_SHA}-${BUILD_RUN_ID}-"
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ && "$IMAGE" == "$prefix"* ]] ||
            { echo "::error::Built image does not match validated experimental source/run/target."; exit 1; }
          attempt="${IMAGE#"$prefix"}"
          [[ "$attempt" =~ ^[1-9][0-9]*$ ]] ||
            { echo "::error::Invalid built image attempt."; exit 1; }
          [[ -n "$ACR_LOGIN_SERVER" ]] || { echo "::error::Existing registry binding is empty."; exit 1; }
      - name: 🔒 Authenticate to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: 🔒 Authenticate to existing registry
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"
      - name: 🔎 Require the published image to exist
        run: az acr repository show --name "${ACR_LOGIN_SERVER%%.*}" --image "$IMAGE" --output none
      - name: ⚓ Deploy exact passed image
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ needs.validate.outputs.app_name }}
          images: "${{ secrets.AZURE_CONTAINER_REGISTRY_ADDRESS }}/${{ needs.build.outputs.image }}"
      - name: 🏷️ Set validated COMMIT_SHA app setting
        run: |
          az webapp config appsettings set \
            --name exp-arolariu-ro \
            --resource-group arolariu-rg \
            --settings "COMMIT_SHA=$COMMIT_SHA" \
            --output none
      - name: 📊 Deployment summary
        run: |
          {
            echo "## Experimental production release (exp-arolariu-ro)"
            printf -- '- Source SHA: `%s`\n- Workflow-definition SHA: `%s`\n' "$COMMIT_SHA" "$WORKFLOW_SHA"
            printf -- '- Exact image (existing environment registry): `%s`\n' "$IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"
