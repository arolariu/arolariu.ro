# Lint, scan, test, and build EXP. Azure runs deploy the image; LOCAL runs upload a Docker archive.
# Runs on main pushes touching the service or on manual dispatch. Tests enforce coverage before the image build.
# Uses environment-scoped Azure OIDC (id-token: write) and records COMMIT_SHA after deployment; does not provision infrastructure.
# Manual runs from main can pin all source checkouts to an optional full commit SHA.
# Validation: dispatch from main with infrastructure=local to build without deploying.

name: "official-exp-trigger"

permissions:
  contents: read # Required to checkout repository

defaults:
  run:
    working-directory: ./sites/exp.arolariu.ro

on:
  # Automatic trigger on main branch changes to experiments service
  push:
    branches: ["main"]
    paths: ["sites/exp.arolariu.ro/**"]

  # Manual trigger for controlled deployments
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Optional full commit SHA from main history. Dispatch from main; blank uses the dispatch commit."
        required: false
        type: string
        default: ""
      environment:
        description: "Azure deployment environment; ignored for local builds."
        options:
          - "development"
          - "production"
        default: "production"
        required: true
        type: choice
      infrastructure:
        description: "'local' uploads an image artifact without Azure; 'azure' pushes and deploys."
        options:
          - "local"
          - "azure"
        default: "azure"
        required: true
        type: choice

env:
  INFRA: ${{ inputs.infrastructure || 'azure' }}

jobs:
  revision:
    name: Resolve deployment revision
    if: github.repository == 'arolariu/arolariu.ro'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      # Only read the trusted dispatch checkout; inspect the requested commit without executing it.
      - name: Checkout trusted workflow revision and main history
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and select source commit
        id: resolve
        working-directory: .
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          if [[ "$EVENT_NAME" == push ]]; then
            source_sha=$DISPATCH_SHA
          elif [[ "$DISPATCH_REF" == refs/heads/main ]]; then
            source_sha=$(bash .github/scripts/resolve-deploy-revision.sh node-install node-deps-install python-install python-deps-install)
          else
            echo "::error::Manual deployments must be dispatched from main."
            exit 1
          fi
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'Source commit: `%s`\n' "$source_sha" >> "$GITHUB_STEP_SUMMARY"

  test:
    if: github.repository == 'arolariu/arolariu.ro' && (inputs.infrastructure || 'azure') == 'azure'
    name: 🧪 Test phase (1/3)
    needs: revision
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    timeout-minutes: 10
    env:
      COMMIT_SHA: ${{ needs.revision.outputs.source_sha }}
    steps:
      - name: 🛫 Checking out the branch inside the runner environment...
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.revision.outputs.source_sha }}

      - name: 📝 Display workflow context
        run: |
          echo "::group::🔍 Workflow Context"
          echo "┌────────────────────────────────────────────────────────────┐"
          echo "│ 🎯 EXPERIMENTS SERVICE CI/CD PIPELINE                      │"
          echo "├────────────────────────────────────────────────────────────┤"
          echo "│ 📦 Job:           Test phase (1/3)                         │"
          echo "│ 🌍 Environment:   ${{ inputs.environment || 'production' }}"
          echo "│ 🔧 Infrastructure: ${{ env.INFRA }}"
          echo "│ 🏷️ Commit SHA:    $COMMIT_SHA"
          echo "│ 👤 Triggered by:  ${{ github.actor }}"
          echo "│ 📅 Timestamp:     $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "│ 🔗 Run ID:        ${{ github.run_id }}"
          echo "│ 🔢 Run Number:    ${{ github.run_number }}"
          echo "└────────────────────────────────────────────────────────────┘"
          echo "::endgroup::"

      - name: 📦 Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-install: "false"
          node-deps-install: "false"
          python-install: "true"
          python-deps-install: "true"

      - name: 🔍 Running lint checks...
        run: python -m ruff check .

      - name: 🔐 Running security checks...
        run: python -m bandit -q -r . --exclude "./*test*"

      # Use local configuration for tests; deployment settings are not needed for this gate.
      - name: 🧪 Running unit tests...
        env:
          INFRA: local
        run: |
          echo "::group::🧪 Running Python Tests"
          START_TIME=$(date +%s)
          python -m pytest -v --tb=short --cov=. --cov-report=term-missing --cov-fail-under=85
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "::notice::✅ Tests completed in ${DURATION}s"
          echo "::endgroup::"

          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Duration | ${DURATION}s |" >> $GITHUB_STEP_SUMMARY
          echo "| Framework | pytest |" >> $GITHUB_STEP_SUMMARY
          echo "| Python | 3.12 |" >> $GITHUB_STEP_SUMMARY

  build-local:
    if: github.repository == 'arolariu/arolariu.ro' && github.event_name == 'workflow_dispatch' && inputs.infrastructure == 'local'
    name: Build and export the LOCAL EXP image
    needs: revision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      INFRA: local
      COMMIT_SHA: ${{ needs.revision.outputs.source_sha }}
      IMAGE: arolariu-exp-local:${{ needs.revision.outputs.source_sha }}
    steps:
      - name: Checkout the selected source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.revision.outputs.source_sha }}
          persist-credentials: false

      - name: Set up EXP test dependencies
        uses: ./.github/actions/setup-workspace
        with:
          node-install: "false"
          node-deps-install: "false"
          python-install: "true"
          python-deps-install: "true"

      - name: Lint, scan, and test the selected source
        shell: bash
        run: |
          python -m ruff check .
          python -m bandit -q -r . --exclude "./*test*"
          python -m pytest -v --tb=short --cov=. --cov-report=term-missing --cov-fail-under=85

      - name: Build the LOCAL EXP image
        shell: bash
        run: |
          # Append runtime metadata to the selected final stage without resolving a second base image.
          {
            cat Dockerfile
            printf '\nENV INFRA=local COMMIT_SHA=%s\n' "$COMMIT_SHA"
          } | docker build --file - --tag "$IMAGE" .

      - name: Export the LOCAL image
        shell: bash
        run: |
          image_env=$(docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$IMAGE")
          grep -Fxq 'INFRA=local' <<< "$image_env"
          grep -Fxq "COMMIT_SHA=$COMMIT_SHA" <<< "$image_env"
          if grep -Eq '^AZURE_(TENANT_ID|SUBSCRIPTION_ID|CLIENT_ID)=.+' <<< "$image_env"; then
            echo "::error::LOCAL image contains an Azure identity configuration"
            exit 1
          fi
          platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")
          mkdir -p "$RUNNER_TEMP/local-image"
          cd "$RUNNER_TEMP/local-image"
          IMAGE_ARCHIVE=arolariu-exp-local.tar.gz
          docker image save "$IMAGE" | gzip -n > "$IMAGE_ARCHIVE"
          test -s "$IMAGE_ARCHIVE"
          sha256sum "$IMAGE_ARCHIVE" > "$IMAGE_ARCHIVE.sha256"
          printf 'Image: `%s` (%s)\n\nSource: `%s`\n\nImport: `docker load -i %s`\n' \
            "$IMAGE" "$platform" "$COMMIT_SHA" "$IMAGE_ARCHIVE" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the LOCAL EXP image and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exp-local-image-${{ needs.revision.outputs.source_sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/local-image/arolariu-exp-local.tar.gz
            ${{ runner.temp }}/local-image/arolariu-exp-local.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-azure:
    if: github.repository == 'arolariu/arolariu.ro' && (inputs.infrastructure || 'azure') == 'azure'
    name: 🛠️ Build phase (2/3)
    needs: [revision, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Azure OIDC
    environment: ${{ inputs.environment || 'production' }}
    env:
      COMMIT_SHA: ${{ needs.revision.outputs.source_sha }}
      CONTAINER_TAG:
        ${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}-{2}', needs.revision.outputs.source_sha, github.run_id,
        github.run_attempt) || needs.revision.outputs.source_sha }}
    outputs:
      image_tag: ${{ steps.push-image.outputs.image_tag }}
    steps:
      - name: 🛫 Checking out the branch inside the runner environment...
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.revision.outputs.source_sha }}

      - name: 📝 Display build context
        run: |
          echo "::group::🔍 Build Context"
          echo "┌────────────────────────────────────────────────────────────┐"
          echo "│ 🏗️ BUILD PHASE                                            │"
          echo "├────────────────────────────────────────────────────────────┤"
          echo "│ 📦 Job:           Build phase (2/3)                        │"
          echo "│ 🐳 Container:     exp/exp.arolariu         │"
          echo "│ 🏷️ Tag:          $CONTAINER_TAG"
          echo "│ 🌍 Environment:   ${{ inputs.environment || 'production' }}"
          echo "│ 📅 Timestamp:     $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "└────────────────────────────────────────────────────────────┘"
          echo "::endgroup::"

      - name: 🔒 Performing auth against Azure Public Cloud...
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🔒 Performing auth against private Azure Container Registry...
        working-directory: "."
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"
        env:
          ACR_LOGIN_SERVER: ${{ secrets.AZURE_CONTAINER_REGISTRY_ADDRESS }}

      - name: 🏗️ Building the docker container...
        env:
          CONTAINER_NAME: "exp/exp.arolariu"
        run: |
          echo "::group::🐳 Docker Build"
          echo "┌────────────────────────────────────────────────────────────┐"
          echo "│ 🐳 DOCKER BUILD STARTED                                    │"
          echo "├────────────────────────────────────────────────────────────┤"
          echo "│ 📦 Image: ${{ secrets.AZURE_CONTAINER_REGISTRY_ADDRESS }}/${{env.CONTAINER_NAME}}:${{env.CONTAINER_TAG}}"
          echo "│ 📁 Context: ./sites/exp.arolariu.ro"
          echo "│ 🔧 Build args:"
          echo "│    - COMMIT_SHA=${{ env.COMMIT_SHA }}"
          echo "│    - INFRA=${{ env.INFRA }}"
          echo "└────────────────────────────────────────────────────────────┘"
          echo ""
          START_TIME=$(date +%s)
          docker build \
            -t ${{ secrets.AZURE_CONTAINER_REGISTRY_ADDRESS }}/${{env.CONTAINER_NAME}}:${{env.CONTAINER_TAG}} \
            .
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo ""
          echo "::notice::✅ Docker build completed in ${DURATION}s"
          echo "::endgroup::"

          IMAGE_SIZE=$(docker images --format "{{.Size}}" ${{ secrets.AZURE_CONTAINER_REGISTRY_ADDRESS }}/${{env.CONTAINER_NAME}}:${{env.CONTAINER_TAG}})
          echo "📦 Image size: $IMAGE_SIZE"

          echo "## 🐳 Docker Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build Duration | ${DURATION}s |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Size | ${IMAGE_SIZE} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container | \`${{env.CONTAINER_NAME}}:${{env.CONTAINER_TAG}}\` |" >> $GITHUB_STEP_SUMMARY

      - name: ⏫ Pushing the docker container...
        id: push-image
        env:
          CONTAINER_NAME: "exp/exp.arolariu"
        run: |
          echo "::group::⏫ Docker Push"
          echo "📤 Pushing to Azure Container Registry..."
          START_TIME=$(date +%s)
          docker push ${{ secrets.AZURE_CONTAINER_REGISTRY_ADDRESS }}/${{env.CONTAINER_NAME}}:${{env.CONTAINER_TAG}}
          printf 'image_tag=%s\n' "$CONTAINER_TAG" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "::notice::✅ Docker push completed in ${DURATION}s"
          echo "::endgroup::"

  deploy-azure:
    if: github.repository == 'arolariu/arolariu.ro' && (inputs.infrastructure || 'azure') == 'azure'
    name: 🚀 Deploy phase (3/3)
    needs: [revision, build-azure]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Azure OIDC
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    env:
      COMMIT_SHA: ${{ needs.revision.outputs.source_sha }}
      CONTAINER_TAG: ${{ needs.build-azure.outputs.image_tag }}
    steps:
      - name: 🔒 Handling the auth process to Azure Public Cloud...
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🔒 Performing auth against private Azure Container Registry...
        working-directory: "."
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"
        env:
          ACR_LOGIN_SERVER: ${{ secrets.AZURE_CONTAINER_REGISTRY_ADDRESS }}

      - name: ⚓ Deploying docker container to Azure App Service...
        id: deploy-to-webapp
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        env:
          CONTAINER_NAME: "exp/exp.arolariu"
        with:
          app-name: "exp-arolariu-ro"
          images: "${{ secrets.AZURE_CONTAINER_REGISTRY_ADDRESS }}/${{env.CONTAINER_NAME}}:${{env.CONTAINER_TAG}}"

      # Persist the deployed revision after the SHA-tagged image has been accepted.
      - name: 🏷️ Set COMMIT_SHA app setting
        working-directory: .
        run: |
          az webapp config appsettings set \
            --name exp-arolariu-ro \
            --resource-group arolariu-rg \
            --settings "COMMIT_SHA=$COMMIT_SHA" \
            --output none
