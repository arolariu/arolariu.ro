# Test the API and build its image. Azure runs push to ACR and deploy; LOCAL runs upload a Docker archive.
# Runs on main pushes touching the API directory or on manual dispatch. Tests and category parity gate the image build.
# Publishes TRX and coverage artifacts; does not build the website or provision Azure resources.
# Azure login uses environment-scoped OIDC (id-token: write); deploy targets the API app.
# Manual runs from main can pin all source checkouts to an optional full commit SHA.
# Validation: dispatch from main with infrastructure=local to build without deploying.

name: "official-api-trigger"

permissions:
  contents: read # Required to checkout repository

defaults:
  run:
    working-directory: ./sites/api.arolariu.ro

on:
  # Automatic trigger on main branch changes to backend API
  push:
    branches: ["main"]
    paths: ["sites/api.arolariu.ro/**"]

  # Manual trigger for controlled deployments
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Optional full commit SHA from main history. Dispatch from main; blank uses the dispatch commit."
        required: false
        type: string
        default: ""
      environment:
        description: "Azure deployment environment; ignored for local builds."
        options:
          - "development"
          - "production"
        default: "production"
        required: true
        type: choice
      infrastructure:
        description: "'local' uploads an image artifact without Azure; 'azure' pushes and deploys."
        options:
          - "local"
          - "azure"
        default: "azure"
        required: true
        type: choice

env:
  API_NAME: "api.arolariu.ro"
  API_URL: "https://api.arolariu.ro"
  INFRA: ${{ inputs.infrastructure || 'azure' }}

jobs:
  revision:
    name: Resolve deployment revision
    if: github.repository == 'arolariu/arolariu.ro'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      # Only read the trusted dispatch checkout; inspect the requested commit without executing it.
      - name: Checkout trusted workflow revision and main history
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and select source commit
        id: resolve
        working-directory: .
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          if [[ "$EVENT_NAME" == push ]]; then
            source_sha=$DISPATCH_SHA
          elif [[ "$DISPATCH_REF" == refs/heads/main ]]; then
            source_sha=$(bash .github/scripts/resolve-deploy-revision.sh node-install node-deps-install dotnet-install install-dotnet-deps)
          else
            echo "::error::Manual deployments must be dispatched from main."
            exit 1
          fi
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'Source commit: `%s`\n' "$source_sha" >> "$GITHUB_STEP_SUMMARY"

  test:
    if: github.repository == 'arolariu/arolariu.ro' && (inputs.infrastructure || 'azure') == 'azure'
    name: 🧪 Test phase (1/3)
    needs: revision
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    timeout-minutes: 10
    env:
      COMMIT_SHA: ${{ needs.revision.outputs.source_sha }}
    steps:
      - name: Checkout the trusted event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && needs.revision.outputs.source_sha != github.sha && '0' || '1' }}

      # Validate against the trusted history in this job before executing code from an older checkout.
      - &validated_checkout
        name: Validate and check out the selected revision
        if: needs.revision.outputs.source_sha != github.sha
        shell: bash
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          REQUESTED_SHA: ${{ needs.revision.outputs.source_sha }}
        run: bash .github/scripts/resolve-deploy-revision.sh --checkout

      - name: 📝 Display workflow context
        run: |
          echo "::group::🔍 Workflow Context"
          echo "┌────────────────────────────────────────────────────────────┐"
          echo "│ 🎯 BACKEND API CI/CD PIPELINE                              │"
          echo "├────────────────────────────────────────────────────────────┤"
          echo "│ 📦 Job:           Test phase (1/3)                         │"
          echo "│ 🌍 Environment:   ${{ inputs.environment || 'production' }}"
          echo "│ 🔧 Infrastructure: ${{ env.INFRA }}"
          echo "│ 🏷️ Commit SHA:    $COMMIT_SHA"
          echo "│ 👤 Triggered by:  ${{ github.actor }}"
          echo "│ 📅 Timestamp:     $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "│ 🔗 Run ID:        ${{ github.run_id }}"
          echo "│ 🔢 Run Number:    ${{ github.run_number }}"
          echo "└────────────────────────────────────────────────────────────┘"
          echo "::endgroup::"

      - name: 📦 Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-install: "true"
          node-deps-install: "true"
          dotnet-install: "true"
          install-dotnet-deps: "true"

      - &verify_catalog_assets
        name: Verify the selected revision's catalog assets
        shell: bash
        working-directory: .
        run: |
          if [[ -f scripts/common/category-catalog-parity.test.ts ]]; then
            npm exec --no -- vitest run category-catalog-parity.test.ts --coverage.enabled=false
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$COMMIT_SHA" != "$GITHUB_SHA" \
            && -f scripts/commands/generate/taxonomy-check.ts \
            && ! -d sites/api.arolariu.ro/src/Invoices/Resources/Categories \
            && ! -d sites/arolariu.ro/src/data/categories ]]; then
            # An explicitly pinned pre-cutover checkout still owns its historical offline check.
            node scripts/cli.ts generate --check-taxonomies --json
          else
            echo "::error::The selected API revision has no supported catalog check."
            exit 1
          fi

      - name: 🧪 Running unit tests...
        working-directory: .
        run: |
          echo "::group::🧪 Running .NET Unit Tests"
          echo "📍 Solution: arolariu.slnx"
          echo "📍 Configuration: Release"
          echo "📍 Test framework: MSTest"
          echo ""
          START_TIME=$(date +%s)
          dotnet test --configuration Release --logger trx --results-directory ./sites/api.arolariu.ro/TestResults --collect:"XPlat Code Coverage" ./arolariu.slnx
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo ""
          echo "::notice::✅ Unit tests completed in ${DURATION}s"
          echo "::endgroup::"

          # Write to job summary
          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Duration | ${DURATION}s |" >> $GITHUB_STEP_SUMMARY
          echo "| Configuration | Release |" >> $GITHUB_STEP_SUMMARY
          echo "| Results Directory | ./sites/api.arolariu.ro/TestResults |" >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload test results...
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ github.run_id }}
          path: sites/api.arolariu.ro/TestResults/
          if-no-files-found: warn
          retention-days: 7

      - name: 📊 Test phase summary
        if: always()
        run: |
          echo "::group::📊 Test Phase Summary"
          echo "┌────────────────────────────────────────────────────────────┐"
          echo "│ ✅ TEST PHASE COMPLETED                                    │"
          echo "├────────────────────────────────────────────────────────────┤"
          echo "│ 📁 Artifacts: test-results-${{ github.run_id }}"
          echo "│ 📅 Completed: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "│ 🔗 Job URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "└────────────────────────────────────────────────────────────┘"
          echo "::endgroup::"

  build-local:
    if: github.repository == 'arolariu/arolariu.ro' && github.event_name == 'workflow_dispatch' && inputs.infrastructure == 'local'
    name: Build and export the LOCAL API image
    needs: revision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      INFRA: local
      COMMIT_SHA: ${{ needs.revision.outputs.source_sha }}
      IMAGE: arolariu-api-local:${{ needs.revision.outputs.source_sha }}
    steps:
      - name: Checkout the trusted event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && needs.revision.outputs.source_sha != github.sha && '0' || '1' }}
          persist-credentials: false

      - *validated_checkout

      - name: Set up API test dependencies
        uses: ./.github/actions/setup-workspace
        with:
          node-install: "true"
          node-deps-install: "true"
          dotnet-install: "true"
          install-dotnet-deps: "true"

      - *verify_catalog_assets

      - name: Test the selected source
        working-directory: .
        run: |
          dotnet test --configuration Release --logger trx \
            --results-directory ./sites/api.arolariu.ro/TestResults \
            --collect:"XPlat Code Coverage" ./arolariu.slnx

      - name: Upload LOCAL API test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-local-test-results-${{ github.run_attempt }}
          path: sites/api.arolariu.ro/TestResults/
          if-no-files-found: warn
          retention-days: 7

      - name: Build the LOCAL API image
        shell: bash
        run: |
          docker build \
            --build-arg "API_NAME=$API_NAME" \
            --build-arg API_URL=http://localhost:8080 \
            --build-arg "COMMIT_SHA=$COMMIT_SHA" \
            --build-arg INFRA=local \
            --tag "$IMAGE" .

      - name: Export the LOCAL image
        shell: bash
        run: |
          image_env=$(docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$IMAGE")
          grep -Fxq 'INFRA=local' <<< "$image_env"
          grep -Fxq "COMMIT_SHA=$COMMIT_SHA" <<< "$image_env"
          if grep -Eq '^AZURE_(TENANT_ID|SUBSCRIPTION_ID|CLIENT_ID)=.+' <<< "$image_env"; then
            echo "::error::LOCAL image contains an Azure identity configuration"
            exit 1
          fi
          platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")
          mkdir -p "$RUNNER_TEMP/local-image"
          cd "$RUNNER_TEMP/local-image"
          IMAGE_ARCHIVE=arolariu-api-local.tar.gz
          docker image save "$IMAGE" | gzip -n > "$IMAGE_ARCHIVE"
          test -s "$IMAGE_ARCHIVE"
          sha256sum "$IMAGE_ARCHIVE" > "$IMAGE_ARCHIVE.sha256"
          printf 'Image: `%s` (%s)\n\nSource: `%s`\n\nImport: `docker load -i %s`\n' \
            "$IMAGE" "$platform" "$COMMIT_SHA" "$IMAGE_ARCHIVE" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the LOCAL API image and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-local-image-${{ needs.revision.outputs.source_sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/local-image/arolariu-api-local.tar.gz
            ${{ runner.temp }}/local-image/arolariu-api-local.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-azure:
    if: github.repository == 'arolariu/arolariu.ro' && (inputs.infrastructure || 'azure') == 'azure'
    name: 🛠️ Build phase (2/3)
    needs: [revision, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Azure OIDC
    environment: ${{ inputs.environment || 'production' }}
    env:
      COMMIT_SHA: ${{ needs.revision.outputs.source_sha }}
      CONTAINER_TAG:
        ${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}-{2}', needs.revision.outputs.source_sha, github.run_id,
        github.run_attempt) || 'latest' }}
    outputs:
      image_tag: ${{ steps.push-image.outputs.image_tag }}
    steps:
      - name: Checkout the trusted event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && needs.revision.outputs.source_sha != github.sha && '0' || '1' }}

      - *validated_checkout

      - name: 📝 Display build context
        run: |
          echo "::group::🔍 Build Context"
          echo "┌────────────────────────────────────────────────────────────┐"
          echo "│ 🏗️ BUILD PHASE                                            │"
          echo "├────────────────────────────────────────────────────────────┤"
          echo "│ 📦 Job:           Build phase (2/3)                        │"
          echo "│ 🐳 Container:     backend/api.arolariu                     │"
          echo "│ 🏷️ Tag:          $CONTAINER_TAG"
          echo "│ 🌍 Environment:   ${{ inputs.environment || 'production' }}"
          echo "│ 📅 Timestamp:     $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "└────────────────────────────────────────────────────────────┘"
          echo "::endgroup::"

      - name: 📦 Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-install: "true"
          node-deps-install: "true"

      - *verify_catalog_assets

      - name: 🔒 Performing auth against Azure Public Cloud...
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🔒 Performing auth against private Azure Container Registry...
        working-directory: "."
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"
        env:
          ACR_LOGIN_SERVER: ${{ secrets.AZURE_CONTAINER_REGISTRY_ADDRESS }}

      - name: 🏗️ Building the docker container...
        env:
          CONTAINER_NAME: "backend/api.arolariu"
          AZURE_TENANT_ID: ${{secrets.AZURE_TENANT_ID}}
          AZURE_SUBSCRIPTION_ID: ${{secrets.AZURE_SUBSCRIPTION_ID}}
          AZURE_CLIENT_ID: ${{secrets.AZURE_BACKEND_MANAGED_IDENTITY_CLIENT_ID}}
        run: |
          echo "::group::🐳 Docker Build"
          echo "┌────────────────────────────────────────────────────────────┐"
          echo "│ 🐳 DOCKER BUILD STARTED                                    │"
          echo "├────────────────────────────────────────────────────────────┤"
          echo "│ 📦 Image: ${{ secrets.AZURE_CONTAINER_REGISTRY_ADDRESS }}/${{env.CONTAINER_NAME}}:${{env.CONTAINER_TAG}}"
          echo "│ 📁 Context: ./sites/api.arolariu.ro"
          echo "│ 🔧 Build args:"
          echo "│    - API_NAME=${{ env.API_NAME }}"
          echo "│    - API_URL=${{ env.API_URL }}"
          echo "│    - COMMIT_SHA=${{ env.COMMIT_SHA }}"
          echo "│    - INFRA=${{ env.INFRA }}"
          echo "└────────────────────────────────────────────────────────────┘"
          echo ""
          START_TIME=$(date +%s)
          docker build \
            --build-arg API_NAME="${{ env.API_NAME }}" \
            --build-arg API_URL="${{ env.API_URL }}" \
            --build-arg COMMIT_SHA="${{ env.COMMIT_SHA }}" \
            --build-arg INFRA="${{ env.INFRA }}" \
            --build-arg AZURE_TENANT_ID="${{ env.AZURE_TENANT_ID }}" \
            --build-arg AZURE_SUBSCRIPTION_ID="${{ env.AZURE_SUBSCRIPTION_ID }}" \
            --build-arg AZURE_CLIENT_ID="${{ env.AZURE_CLIENT_ID }}" \
            -t ${{ secrets.AZURE_CONTAINER_REGISTRY_ADDRESS }}/${{env.CONTAINER_NAME}}:${{env.CONTAINER_TAG}} \
            .
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo ""
          echo "::notice::✅ Docker build completed in ${DURATION}s"
          echo "::endgroup::"

          # Get image size
          IMAGE_SIZE=$(docker images --format "{{.Size}}" ${{ secrets.AZURE_CONTAINER_REGISTRY_ADDRESS }}/${{env.CONTAINER_NAME}}:${{env.CONTAINER_TAG}})
          echo "📦 Image size: $IMAGE_SIZE"

          # Write to job summary
          echo "## 🐳 Docker Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build Duration | ${DURATION}s |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Size | ${IMAGE_SIZE} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container | \`${{env.CONTAINER_NAME}}:${{env.CONTAINER_TAG}}\` |" >> $GITHUB_STEP_SUMMARY

      - name: ⏫ Pushing the docker container...
        id: push-image
        env:
          CONTAINER_NAME: "backend/api.arolariu"
        run: |
          echo "::group::⏫ Docker Push"
          echo "📤 Pushing to Azure Container Registry..."
          START_TIME=$(date +%s)
          docker push ${{ secrets.AZURE_CONTAINER_REGISTRY_ADDRESS }}/${{env.CONTAINER_NAME}}:${{env.CONTAINER_TAG}}
          printf 'image_tag=%s\n' "$CONTAINER_TAG" >> "$GITHUB_OUTPUT"
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "::notice::✅ Docker push completed in ${DURATION}s"
          echo "::endgroup::"

  deploy-azure:
    if: github.repository == 'arolariu/arolariu.ro' && (inputs.infrastructure || 'azure') == 'azure'
    name: 🚀 Deploy phase (3/3)
    needs: [revision, build-azure]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Azure OIDC
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    env:
      COMMIT_SHA: ${{ needs.revision.outputs.source_sha }}
      CONTAINER_TAG: ${{ needs.build-azure.outputs.image_tag }}
    steps:
      - name: 🔒 Handling the auth process to Azure Public Cloud...
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🔒 Performing auth against private Azure Container Registry...
        working-directory: "."
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"
        env:
          ACR_LOGIN_SERVER: ${{ secrets.AZURE_CONTAINER_REGISTRY_ADDRESS }}

      # Use the same image tag rule as the build and push steps above.
      - name: ⚓ Deploying docker container to Azure App Service...
        id: deploy-to-webapp
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        env:
          CONTAINER_NAME: "backend/api.arolariu"
        with:
          app-name: "api-arolariu-ro"
          images: "${{ secrets.AZURE_CONTAINER_REGISTRY_ADDRESS }}/${{env.CONTAINER_NAME}}:${{env.CONTAINER_TAG}}"
